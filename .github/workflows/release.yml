name: Release

# Publishes a release only when a SemVer tag (vMAJOR.MINOR.PATCH[-prerelease]) that points to a commit on
# master is pushed. Every published version becomes a normal GitHub release marked Latest; a SemVer
# pre-release (hyphenated) version is still a pre-release for Docker aliases and release-note wording
# (policy and tests: .github/release-policy/). Manual runs and pull requests that touch release inputs are dry runs: they build,
# package and smoke-test everything but publish nothing. See docs/ai-context/build-and-test.md
# §Release workflow.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
      - "global.json"
      - "CampertronConsole/Dockerfile"
      - ".dockerignore"
      - "**/*.csproj"
      - "Campertron.sln"
      - "CampertronLibrary/content/**"
      - ".github/release-policy/**"
      # GUI changes get the native GUI smoke tests below (R8).
      - "CampertronGUI/**"
      # The other shipped inputs (D105): the web UI, the library, the console and the app icon are built into the
      # archives and the image, so their changes get the same packaging, native, container and web mode smoke tests.
      # test-release-policy.sh checks this list against the released projects' inputs (release-inputs.py).
      - "CampertronWeb/**"
      - "CampertronLibrary/**"
      - "CampertronConsole/**"
      - "assets/icon/**"

# Least privilege: every job reads the repository only, unless it grants itself more below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: Release verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tag push: the tag must be SemVer, point to a commit on master and not have a release yet.
      # Anything else is a dry run with version 0.0.0-dryrun.<run number>.
      - name: Determine version and mode
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if ! [[ "$REF_NAME" =~ $semver ]]; then
              echo "::error::Tag $REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::Tag $REF_NAME points to $GITHUB_SHA, which is not on master"
              exit 1
            fi
            if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::A GitHub release for $REF_NAME already exists"
              exit 1
            fi
            version="${REF_NAME#v}"
            publish=true
          else
            version="0.0.0-dryrun.${RUN_NUMBER}"
            publish=false
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release mode"
            echo "- Version: \`$version\`"
            echo "- Prerelease: $prerelease"
            echo "- Publish: $publish (dry run unless a release tag on master was pushed)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Prerelease and stable behaviour of the release policy (Docker tags, GitHub release flags,
      # release notes); runs on every trigger, including pull-request and manual dry runs.
      - name: Test release policy
        run: bash .github/release-policy/test-release-policy.sh

      # Every tracked curated release-note fragment (.github/release-notes/) must be valid on every trigger;
      # each composed body and its SHA-256 is shown in the job summary (decision D30).
      - name: Check curated release notes
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          rc=0
          check_curated_notes_dir .github/release-notes "$image" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/curated-notes.md" || rc=$?
          cat "$RUNNER_TEMP/curated-notes.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/curated-notes.md"
          exit "$rc"

      # A publishing tag needs its reviewed fragment .github/release-notes/v<version>.md in the tagged commit.
      # Without a valid one nothing is built or published; there is no template-only fallback.
      - name: Require curated release notes for a publishing tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          if [ "$PUBLISH" != "true" ]; then
            echo "Dry run: version $VERSION cannot publish, so no curated fragment is required for it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          expected_archives "$VERSION" > "$RUNNER_TEMP/expected.txt"
          assemble_release_notes true "$VERSION" "$PRERELEASE" "$image" "$GITHUB_REPOSITORY" .github/release-notes > "$RUNNER_TEMP/RELEASE_NOTES.md"
          validate_notes "$RUNNER_TEMP/RELEASE_NOTES.md" "$VERSION" "$PRERELEASE" "$image" "$RUNNER_TEMP/expected.txt"
          echo "Curated notes $(curated_notes_path "$VERSION") compose and validate; body SHA-256 $(sha256sum < "$RUNNER_TEMP/RELEASE_NOTES.md" | cut -d' ' -f1)." | tee -a "$GITHUB_STEP_SUMMARY"

      # Every .csproj targets exactly net11.0 (no TargetFrameworks, RuntimeFrameworkVersion or RollForward),
      # the root global.json is the approved SDK policy, and the Dockerfile uses .NET 11.0 SDK and runtime images.
      - name: Check projects target .NET 11
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_project_frameworks .
          echo "All projects, build properties, global.json and Docker base images are .NET 11."

      - name: Set up .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      # setup-dotnet only installs; the root global.json makes dotnet resolve a stable .NET 11 SDK (decision D31).
      - name: Check SDK policy and selected SDK
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_global_json .
          sdk="$(dotnet --version)"
          check_selected_sdk "$sdk"
          echo "Selected .NET SDK: $sdk"
          dotnet --info

      - name: Restore
        run: dotnet restore Campertron.sln -p:Configuration=Release

      # No prerelease package, and no EF Core, Microsoft.Data.Sqlite or Microsoft.Extensions package of another .NET major.
      - name: Check package policy
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          mapfile -t assets < <(find . -path '*/obj/project.assets.json' -not -path './.git/*' | sort)
          [ "${#assets[@]}" -ge 5 ] || { echo "::error::expected restored assets for 5 projects, found ${#assets[@]}"; exit 1; }
          check_package_policy "${assets[@]}"
          echo "Package policy passed for ${#assets[@]} projects."

      - name: Build (Release)
        run: dotnet build Campertron.sln --configuration Release --no-restore

      # Integration tests (the embedded DB; no network, NoLiveNetwork); isolated as in ci.yml. A failure blocks the release.
      - name: Test (Release)
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/campertron-data
        timeout-minutes: 15
        run: |
          mkdir -p "$XDG_DATA_HOME"
          dotnet test Campertron.sln --configuration Release --no-build --blame-hang-timeout 10m

      - name: Vulnerability scan
        run: |
          set -euo pipefail
          mapfile -t projects < <(dotnet sln Campertron.sln list | grep -E '\.csproj$')
          # As in ci.yml: a scan that finds no project must fail, not pass with a count of 0.
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::No .csproj projects found in Campertron.sln"
            exit 1
          fi
          total=0
          for project in "${projects[@]}"; do
            json="$(dotnet list "$project" package --vulnerable --include-transitive --format json)"
            count="$(jq '[.projects[]?.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[]] | length' <<<"$json")"
            echo "Vulnerable packages in $project: $count"
            total=$((total + count))
          done
          if [ "$total" -gt 0 ]; then
            echo "::error::$total vulnerable package(s) found"
            exit 1
          fi

  binaries:
    name: Package ${{ matrix.app.name }} ${{ matrix.rid }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: console, project: CampertronConsole }
          - { name: gui, project: CampertronGUI }
        rid: [linux-arm, linux-arm64, linux-x64, osx-arm64, osx-x64, win-arm64, win-x64, win-x86]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      APP: ${{ matrix.app.name }}
      PROJECT: ${{ matrix.app.project }}
      RID: ${{ matrix.rid }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      # setup-dotnet only installs; the root global.json makes dotnet resolve a stable .NET 11 SDK (decision D31).
      - name: Check SDK policy and selected SDK
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_global_json .
          sdk="$(dotnet --version)"
          check_selected_sdk "$sdk"
          echo "Selected .NET SDK: $sdk"
          dotnet --info

      # Self-contained, not single-file, not trimmed (EF Core, YamlDotNet and ReactiveUI use reflection).
      - name: Publish
        run: |
          dotnet publish "$PROJECT/$PROJECT.csproj" --configuration Release --runtime "$RID" \
            --self-contained true -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true \
            --output "publish/$PROJECT"

      - name: Check package contents
        run: |
          set -euo pipefail
          dir="publish/$PROJECT"
          case "$RID" in
            win-*)   host="$PROJECT.exe"; sqlite="e_sqlite3.dll";      compression="System.IO.Compression.Native.dll" ;;
            osx-*)   host="$PROJECT";     sqlite="libe_sqlite3.dylib"; compression="libSystem.IO.Compression.Native.dylib" ;;
            linux-*) host="$PROJECT";     sqlite="libe_sqlite3.so";    compression="libSystem.IO.Compression.Native.so" ;;
          esac
          for file in "$host" CampertronLibrary.dll "$sqlite" "$compression"; do
            if [ ! -f "$dir/$file" ]; then
              echo "::error::$RID $APP package is missing $file"
              exit 1
            fi
          done
          # The console hosts the web UI (CampertronConsole --web, D92): its compiled pages and embedded files are in
          # CampertronWeb.dll, and the ASP.NET Core framework is bundled. Checked for every platform, linux-arm included,
          # which no job runs; the web mode smoke tests below run it on the others (D102).
          if [ "$APP" = "console" ]; then
            for file in CampertronWeb.dll Microsoft.AspNetCore.dll; do
              if [ ! -f "$dir/$file" ]; then
                echo "::error::$RID $APP package is missing $file (the web UI)"
                exit 1
              fi
            done
          fi
          # TD-35: Windows GUI packages keep the Skia, HarfBuzz and ANGLE native DLLs but not the native debug symbols of
          # SkiaSharp/HarfBuzzSharp (excluded in CampertronGUI.csproj), neither as files nor as .deps.json entries.
          # Campertron's own managed PDBs (CampertronGUI.pdb, CampertronLibrary.pdb) are expected and allowed.
          if [ "$APP" = "gui" ] && [[ "$RID" == win-* ]]; then
            for file in libSkiaSharp.dll libHarfBuzzSharp.dll av_libglesv2.dll; do
              if [ ! -f "$dir/$file" ]; then
                echo "::error::$RID $APP package is missing $file"
                exit 1
              fi
            done
            for file in libSkiaSharp.pdb libHarfBuzzSharp.pdb; do
              if [ -e "$dir/$file" ]; then
                echo "::error::$RID $APP package contains the native debug symbols $file (TD-35)"
                exit 1
              fi
            done
            if ! jq -e '[.targets[][] | (.native // {}) | keys[] | select(test("(^|/)lib(SkiaSharp|HarfBuzzSharp)\\.pdb$"))] | length == 0' "$dir/$PROJECT.deps.json" > /dev/null; then
              echo "::error::$RID $APP $PROJECT.deps.json lists native debug symbols of SkiaSharp or HarfBuzzSharp (TD-35)"
              exit 1
            fi
          fi
          echo "$RID $APP: $(find "$dir" -type f | wc -l) files, $(du -sm "$dir" | cut -f1) MB"

      # The output that becomes the archive must be a self-contained .NET 11 app: runtimeconfig (tfm net11.0,
      # Microsoft.NETCore.App 11.x only), deps.json (.NETCoreApp v11.0/<rid>, 11.x runtime pack) and a .NET 11
      # System.Private.CoreLib.dll, with no other .NET major in any JSON file; and Campertron's own PDBs must come
      # from an SDK 11 compiler (portable-PDB provenance; the assemble job compares all 16 archives).
      - name: Check .NET 11 runtime and compiler provenance
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_publish_runtime "publish/$PROJECT" "$PROJECT" "$RID"
          # On failure, print the check's ::error:: line, which the assignment would otherwise swallow.
          if ! toolchain="$(check_pdb_provenance "publish/$PROJECT" "$PROJECT")"; then
            echo "$toolchain"
            exit 1
          fi
          echo "$RID $APP: .NET 11 runtime $(jq -r '.runtimeOptions.includedFrameworks[] | select(.name == "Microsoft.NETCore.App") | .version' "publish/$PROJECT/$PROJECT.runtimeconfig.json"), compiler $toolchain"

      # ZIP for Windows, tar.gz (keeps the executable bit) for Linux and macOS. Each archive has one top-level folder.
      - name: Create archive
        run: |
          set -euo pipefail
          base="campertron-${APP}-${VERSION}-${RID}"
          mkdir -p staging dist
          mv "publish/$PROJECT" "staging/$base"
          case "$RID" in
            win-*)
              command -v zip > /dev/null || { sudo apt-get update && sudo apt-get install -y zip; }
              (cd staging && zip -q -r -X "../dist/$base.zip" "$base")
              archive="dist/$base.zip"
              ;;
            *)
              tar -C staging --sort=name --owner=0 --group=0 --numeric-owner -czf "dist/$base.tar.gz" "$base"
              archive="dist/$base.tar.gz"
              ;;
          esac
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          ls -l "$archive"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  # Linux native smoke tests: the linux-x64 and, since S2, the linux-arm64 archives this run built, each on a
  # GitHub-hosted runner of its own architecture (standard runners; never a self-hosted or paid one).
  smoke:
    name: Smoke test ${{ matrix.rid }} (native)
    needs: [verify, binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-latest, runner_arch: X64, process_arch: X64 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, runner_arch: ARM64, process_arch: Arm64 }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      RID: ${{ matrix.rid }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_PROCESS_ARCH: ${{ matrix.process_arch }}
    steps:
      # For release-policy.sh and the ReleaseCheck tool; the apps under test come only from the archives.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner must have the archive's own architecture (RUNNER_ARCH): nothing here is emulated.
      - name: Check the Linux runner architecture
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS $RUNNER_ARCH, image ${ImageOS:-unknown} ${ImageVersion:-unknown}, $(uname -m)"
          if [ "$RUNNER_ARCH" != "$EXPECTED_RUNNER_ARCH" ]; then
            echo "::error::$RID must run on a native $EXPECTED_RUNNER_ARCH runner, got $RUNNER_ARCH"; exit 1
          fi

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-*-${{ matrix.rid }}.tar.gz
          merge-multiple: true
          path: dist
          # Keep each archive exactly as uploaded; without this, .zip archives are extracted on download.
          skip-decompress: true

      # Clean install: the bundled Brotli database is extracted and the console exits (outputTo: UnitTest).
      - name: Console clean install
        run: |
          set -euo pipefail
          tar -xzf "dist/campertron-console-$VERSION-$RID.tar.gz" -C "$RUNNER_TEMP"
          data="$RUNNER_TEMP/console-data"
          mkdir -p "$data/CampertronConfig"
          printf 'outputTo: UnitTest\nrefreshRidbDataDayInterval: 30\nlastRidbDataRefresh: 2026-01-01T00:00:00.0000000Z\nautoRefresh: false\n' > "$data/CampertronConfig/General.yaml"
          XDG_DATA_HOME="$data" timeout 120 "$RUNNER_TEMP/campertron-console-$VERSION-$RID/CampertronConsole"
          db="$data/CampertronConfig/RecreationDotOrg.db"
          size="$(stat -c %s "$db")"
          echo "Extracted database: $size bytes"
          if [ "$size" -lt 100000000 ]; then echo "::error::Extracted database is too small"; exit 1; fi
          if ls "$data/CampertronConfig" | grep -q partial; then echo "::error::Partial extraction file left behind"; exit 1; fi

      # The settings-transfer package's compatibility self-test (TD-69) in the archive's own console, natively:
      # `CampertronConsole --transfer-selftest` runs PBKDF2-HMAC-SHA256 and AES-256-GCM in memory (the round trip, the
      # authenticated header, a wrong passphrase and a changed header, ciphertext or tag refused, a secret-bearing package)
      # and prints fixed facts only; check_transfer_selftest requires every check, this RID, the runner's architecture and
      # nothing on standard error. Its own new XDG_DATA_HOME and HOME must stay empty: it writes no settings.
      - name: Transfer self-test (Linux, native)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          archive="dist/campertron-console-$VERSION-$RID.tar.gz"
          sum="$(sha256sum "$archive" | cut -d' ' -f1)"
          echo "Archive under test: $archive, SHA-256 $sum"
          data="$RUNNER_TEMP/selftest-data"; home="$RUNNER_TEMP/selftest-home"
          mkdir -p "$data" "$home" "$RUNNER_TEMP/smoke"
          set +e
          (cd "$home" && HOME="$home" XDG_DATA_HOME="$data" timeout 120 "$RUNNER_TEMP/campertron-console-$VERSION-$RID/CampertronConsole" --transfer-selftest \
            > "$RUNNER_TEMP/smoke/transfer-selftest.out" 2> "$RUNNER_TEMP/smoke/transfer-selftest.err")
          rc=$?
          set -e
          check_transfer_selftest "$rc" "$RUNNER_TEMP/smoke/transfer-selftest.out" "$RUNNER_TEMP/smoke/transfer-selftest.err" \
            "$RID" "$EXPECTED_PROCESS_ARCH" "$EXPECTED_PROCESS_ARCH" native "$RUNNER_ARCH" > "$RUNNER_TEMP/smoke/transfer-selftest.txt" || { cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"; exit 1; }
          cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"
          if [ -n "$(find "$data" "$home" -mindepth 1 | head -n 1)" ]; then echo "::error::The transfer self-test created a file or folder"; exit 1; fi
          echo "- \`$RID\` console archive \`$sum\`: $(grep '^Transfer self-test evidence: ' "$RUNNER_TEMP/smoke/transfer-selftest.txt")" >> "$GITHUB_STEP_SUMMARY"

      # The published GUI's built-in smoke test (CampertronGUI --smoke-test, R8) under a virtual display: the real window
      # opens with a native handle, the startup extracts the database into a clean XDG_DATA_HOME, a frame is rendered,
      # the data is there and the window closes cleanly. It exits 0 only if every step passed (its own timeout: 60 s).
      - name: GUI smoke test
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          command -v xvfb-run > /dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          tar -xzf "dist/campertron-gui-$VERSION-$RID.tar.gz" -C "$RUNNER_TEMP"
          data="$RUNNER_TEMP/gui-data"
          mkdir -p "$data" "$RUNNER_TEMP/smoke"
          set +e
          XDG_DATA_HOME="$data" xvfb-run -a "$RUNNER_TEMP/campertron-gui-$VERSION-$RID/CampertronGUI" --smoke-test \
            > "$RUNNER_TEMP/smoke/gui-smoke.out" 2> "$RUNNER_TEMP/smoke/gui-smoke.err"
          rc=$?
          set -e
          check_gui_smoke_run "$rc" "$RUNNER_TEMP/smoke/gui-smoke.out" "$RUNNER_TEMP/smoke/gui-smoke.err" "$data/CampertronConfig" "$VERSION"
          test -f "$data/CampertronConfig/RecreationDotOrg.db"

      # `--version` prints RuntimeInformation.FrameworkDescription of the running process. Both published apps
      # must report .NET 11, exactly the runtime bundled in the archive, the version being released and a process of the
      # runner's own architecture. It needs no display and reads or creates no data.
      - name: Runtime reported by the published apps
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          for project in CampertronConsole CampertronGUI; do
            case "$project" in CampertronConsole) app=console ;; *) app=gui ;; esac
            dir="$RUNNER_TEMP/campertron-$app-$VERSION-$RID"
            bundled="$(jq -r '.runtimeOptions.includedFrameworks[] | select(.name == "Microsoft.NETCore.App") | .version' "$dir/$project.runtimeconfig.json")"
            output="$(env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 "$dir/$project" --version)"
            echo "$output"
            check_framework_report "$output" "$bundled"
            if ! head -n 1 <<<"$output" | grep -qE "^$project ${VERSION//./\\.}(\+[0-9a-f]+)?\$"; then
              echo "::error::$project --version does not report version $VERSION"; exit 1
            fi
            grep -qF "($EXPECTED_PROCESS_ARCH)" <<<"$output" || { echo "::error::$project is not a native $EXPECTED_PROCESS_ARCH process"; exit 1; }
          done

      # Web mode's release smoke test (v0.3.0's PR 12, D102): the archive's CampertronConsole --web on 127.0.0.1 and a free
      # port, with a new XDG_DATA_HOME and an empty HOME of its own: its start lines, --healthcheck, /healthz, the request
      # checks, every page behind the password, the setup page and the approved icon, then SIGTERM, exit code 0, the port
      # closed and no process left (.github/release-policy/web-smoke.py). Python's standard library only; nothing leaves
      # the runner, no password is set and the setup code is never shown.
      - name: Web mode smoke test
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -I .github/release-policy/web-smoke.py native --app "$RUNNER_TEMP/campertron-console-$VERSION-$RID/CampertronConsole" \
            --version "$VERSION" --icon assets/icon/campertron.ico

      # The published CampertronLibrary.dll runs its own GUI queries (By City / By State) and the refresh
      # validation against the database that each published app extracted from its embedded resource:
      # two-letter states only, no ZIP codes such as 01005, MA lists BARRE, Corrected layout, validation passes.
      - name: Set up .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      # setup-dotnet only installs; the root global.json makes dotnet resolve a stable .NET 11 SDK (decision D31).
      - name: Check SDK policy and selected SDK
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_global_json .
          sdk="$(dotnet --version)"
          check_selected_sdk "$sdk"
          echo "Selected .NET SDK: $sdk"
          dotnet --info

      - name: GUI state data (published library and database)
        run: |
          set -euo pipefail
          dotnet build .github/release-policy/ReleaseCheck/ReleaseCheck.csproj --configuration Release --output "$RUNNER_TEMP/releasecheck"
          dotnet "$RUNNER_TEMP/releasecheck/ReleaseCheck.dll" "$RUNNER_TEMP/campertron-gui-$VERSION-$RID" "$RUNNER_TEMP/gui-data/CampertronConfig"
          dotnet "$RUNNER_TEMP/releasecheck/ReleaseCheck.dll" "$RUNNER_TEMP/campertron-console-$VERSION-$RID" "$RUNNER_TEMP/console-data/CampertronConfig"

  # Native smoke tests (R8): the archives this run built, which are the ones a tag run publishes, run on GitHub-hosted
  # runners of their own OS and architecture. Self-contained apps, so no .NET SDK is installed or used. Console:
  # --version on the bundled .NET 11 runtime and a clean install that extracts the database. GUI: --version and the
  # built-in smoke test (CampertronGUI --smoke-test: window, native handle, data, rendered frame, clean programmatic
  # close). No screenshots or desktop automation. Read-only; only a failed job uploads its smoke logs.
  # win-x86 (S2) is compatibility execution, not a native run: the 32-bit archives run as 32-bit processes on the 64-bit
  # Windows runner (WOW64), which is how they are normally used; no hosted runner is a 32-bit Windows system.
  native-smoke:
    name: Smoke test ${{ matrix.rid }} (${{ matrix.execution || 'native' }})
    needs: [verify, binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, runner: windows-2025, runner_arch: X64, process_arch: X64 }
          - { rid: win-arm64, runner: windows-11-arm, runner_arch: ARM64, process_arch: Arm64 }
          - { rid: osx-x64, runner: macos-26-intel, runner_arch: X64, process_arch: X64 }
          - { rid: osx-arm64, runner: macos-26, runner_arch: ARM64, process_arch: Arm64 }
          - { rid: win-x86, runner: windows-2025, runner_arch: X64, process_arch: X86, execution: 64-bit Windows }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      RID: ${{ matrix.rid }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_PROCESS_ARCH: ${{ matrix.process_arch }}
    defaults:
      run:
        shell: bash
    steps:
      # For release-policy.sh only; the apps under test come only from the archives.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-*-${{ matrix.rid }}.*
          merge-multiple: true
          path: dist
          # Keep each archive exactly as uploaded; without this, .zip archives are extracted on download.
          skip-decompress: true

      # The runner must be the expected architecture (RUNNER_ARCH), not an emulated one: the archive's own, or for
      # win-x86 the 64-bit Windows it is run on.
      - name: Check the runner architecture
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS $RUNNER_ARCH, image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          if [ "$RUNNER_ARCH" != "$EXPECTED_RUNNER_ARCH" ]; then
            echo "::error::$RID must run on a native $EXPECTED_RUNNER_ARCH runner, got $RUNNER_ARCH"; exit 1
          fi

      - name: Extract archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apps"
          for app in console gui; do
            case "$RID" in
              win-*) powershell -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'dist/campertron-$app-$VERSION-$RID.zip' -DestinationPath '$RUNNER_TEMP/apps'" ;;
              *) tar -xzf "dist/campertron-$app-$VERSION-$RID.tar.gz" -C "$RUNNER_TEMP/apps" ;;
            esac
          done
          ls "$RUNNER_TEMP/apps"

      # The settings-transfer package's compatibility self-test (TD-69) in the archive's own console, as in the Linux smoke
      # job: PBKDF2-HMAC-SHA256 and AES-256-GCM in memory on this platform's cryptography (Windows CNG, Apple's on macOS),
      # fixed facts only, every check required. Native on x64 and arm64; win-x86 is compatibility execution (a 32-bit process
      # on 64-bit Windows, never called native). Campertron's data folders can't be redirected here: they must not exist
      # afterwards (it writes no settings), and the next step requires the same before its clean install.
      - name: Transfer self-test (Windows and macOS)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          exe=""; ext=tar.gz; case "$RID" in win-*) exe=".exe"; ext=zip ;; esac
          case "$RID" in win-x86) execution=compatibility; os_arch=X64 ;; *) execution=native; os_arch="$EXPECTED_PROCESS_ARCH" ;; esac
          archive="dist/campertron-console-$VERSION-$RID.$ext"
          if command -v sha256sum > /dev/null; then sum="$(sha256sum "$archive" | cut -d' ' -f1)"; else sum="$(shasum -a 256 "$archive" | cut -d' ' -f1)"; fi
          echo "Archive under test: $archive, SHA-256 $sum"
          mkdir -p "$RUNNER_TEMP/smoke"
          set +e
          "$RUNNER_TEMP/apps/campertron-console-$VERSION-$RID/CampertronConsole$exe" --transfer-selftest \
            > "$RUNNER_TEMP/smoke/transfer-selftest.out" 2> "$RUNNER_TEMP/smoke/transfer-selftest.err"
          rc=$?
          set -e
          check_transfer_selftest "$rc" "$RUNNER_TEMP/smoke/transfer-selftest.out" "$RUNNER_TEMP/smoke/transfer-selftest.err" \
            "$RID" "$EXPECTED_PROCESS_ARCH" "$os_arch" "$execution" "$RUNNER_ARCH" > "$RUNNER_TEMP/smoke/transfer-selftest.txt" || { cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"; exit 1; }
          cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"
          case "$RID" in
            win-*) data="$(cygpath -u "$LOCALAPPDATA")" ;;
            *) data="$HOME/Library/Application Support" ;;
          esac
          for name in CampertronConfig CampertronCache; do
            if [ -e "$data/$name" ]; then echo "::error::The transfer self-test created $name"; exit 1; fi
          done
          echo "- \`$RID\` console archive \`$sum\`: $(grep '^Transfer self-test evidence: ' "$RUNNER_TEMP/smoke/transfer-selftest.txt")" >> "$GITHUB_STEP_SUMMARY"

      # --version must report this version on the bundled .NET 11 runtime in a native process (the architecture in the
      # Framework line). The clean install extracts the bundled database into an empty data folder (outputTo: UnitTest):
      # the runner user's real LocalApplicationData on the fresh VM, %LOCALAPPDATA%\CampertronConfig on Windows and
      # ~/Library/Application Support/CampertronConfig on macOS (.NET asks macOS for it, so HOME cannot redirect it).
      # Both folders must not exist before; the folders this step creates are removed for the GUI's own clean start.
      - name: Console --version and clean install (native)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          exe=""; case "$RID" in win-*) exe=".exe" ;; esac
          dir="$RUNNER_TEMP/apps/campertron-console-$VERSION-$RID"
          bundled="$(jq -r '.runtimeOptions.includedFrameworks[] | select(.name == "Microsoft.NETCore.App") | .version' "$dir/CampertronConsole.runtimeconfig.json")"
          output="$("$dir/CampertronConsole$exe" --version | tr -d '\r')"
          echo "$output"
          check_framework_report "$output" "$bundled"
          if ! head -n 1 <<<"$output" | grep -qE "^CampertronConsole ${VERSION//./\\.}(\+[0-9a-f]+)?\$"; then
            echo "::error::CampertronConsole --version does not report version $VERSION"; exit 1
          fi
          grep -qF "($EXPECTED_PROCESS_ARCH)" <<<"$output" || { echo "::error::CampertronConsole is not a native $EXPECTED_PROCESS_ARCH process"; exit 1; }
          case "$RID" in
            win-*) data="$(cygpath -u "$LOCALAPPDATA")" ;;
            *) data="$HOME/Library/Application Support" ;;
          esac
          config="$data/CampertronConfig"; cache="$data/CampertronCache"
          if [ -e "$config" ] || [ -e "$cache" ]; then echo "::error::$config or $cache exists before the clean install"; exit 1; fi
          mkdir -p "$config"
          printf 'outputTo: UnitTest\nrefreshRidbDataDayInterval: 30\nlastRidbDataRefresh: 2026-01-01T00:00:00.0000000Z\nautoRefresh: false\n' > "$config/General.yaml"
          "$dir/CampertronConsole$exe"
          size="$(wc -c < "$config/RecreationDotOrg.db" | tr -d ' ')"
          echo "Extracted database: $size bytes"
          if [ "$size" -lt 100000000 ]; then echo "::error::Extracted database is too small"; exit 1; fi
          if ls "$config" | grep -q partial; then echo "::error::Partial extraction file left behind"; exit 1; fi
          # The GUI below starts from an empty data folder again; these folders were created by this step.
          rm -rf "$config" "$cache"

      # Web mode's release smoke test (v0.3.0's PR 12, D102), as in the Linux smoke job: the archive's CampertronConsole
      # --web on 127.0.0.1 and a free port, its lines, --healthcheck, /healthz, the request checks, the password's boundary,
      # the setup page and the approved icon, then a graceful stop (SIGTERM on macOS; on Windows CTRL_BREAK to its own
      # process group, in a job object that shows that no process of it remains), exit code 0, the port closed. Campertron's
      # data folder can't be redirected here, so it runs in the runner's own, which must not have CampertronConfig or
      # CampertronCache yet (the step above removed its own); it removes the two folders again for the GUI's clean start.
      - name: Web mode smoke test (native)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          exe=""; python=python3
          case "$RID" in win-*) exe=".exe"; python=python ;; esac
          "$python" -I .github/release-policy/web-smoke.py native --app "$RUNNER_TEMP/apps/campertron-console-$VERSION-$RID/CampertronConsole$exe" \
            --version "$VERSION" --icon assets/icon/campertron.ico

      # The GUI's built-in smoke test from an empty data folder (the GUI extracts the database itself). It exits 0 only if
      # every step passed, with nothing on standard error; the report must name the platform's data folder (above).
      - name: GUI --version and smoke test (native)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          exe=""; case "$RID" in win-*) exe=".exe" ;; esac
          dir="$RUNNER_TEMP/apps/campertron-gui-$VERSION-$RID"
          bundled="$(jq -r '.runtimeOptions.includedFrameworks[] | select(.name == "Microsoft.NETCore.App") | .version' "$dir/CampertronGUI.runtimeconfig.json")"
          output="$("$dir/CampertronGUI$exe" --version | tr -d '\r')"
          echo "$output"
          check_framework_report "$output" "$bundled"
          if ! head -n 1 <<<"$output" | grep -qE "^CampertronGUI ${VERSION//./\\.}(\+[0-9a-f]+)?\$"; then
            echo "::error::CampertronGUI --version does not report version $VERSION"; exit 1
          fi
          grep -qF "($EXPECTED_PROCESS_ARCH)" <<<"$output" || { echo "::error::CampertronGUI is not a native $EXPECTED_PROCESS_ARCH process"; exit 1; }
          case "$RID" in
            win-*) expected="$LOCALAPPDATA\\CampertronConfig"; config="$(cygpath -u "$LOCALAPPDATA")/CampertronConfig" ;;
            *) expected="$HOME/Library/Application Support/CampertronConfig"; config="$expected" ;;
          esac
          if [ -e "$config" ]; then echo "::error::$config exists before the GUI smoke test"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/smoke"
          set +e
          "$dir/CampertronGUI$exe" --smoke-test > "$RUNNER_TEMP/smoke/gui-smoke.out" 2> "$RUNNER_TEMP/smoke/gui-smoke.err"
          rc=$?
          set -e
          check_gui_smoke_run "$rc" "$RUNNER_TEMP/smoke/gui-smoke.out" "$RUNNER_TEMP/smoke/gui-smoke.err" "$expected" "$VERSION"
          size="$(wc -c < "$config/RecreationDotOrg.db" | tr -d ' ')"
          echo "GUI extracted database: $size bytes"
          if [ "$size" -lt 100000000 ]; then echo "::error::The GUI's extracted database is too small"; exit 1; fi

      - name: Upload smoke logs (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-logs-${{ matrix.rid }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7

  # linux-arm (32-bit Arm) has no GitHub-hosted runner, so its archives are never run natively (ER-28). Its console archive's
  # settings-transfer self-test (TD-69) runs under emulation instead, recorded as emulated and never as native: QEMU's user-mode
  # emulator (qemu-arm-static of Ubuntu 24.04's package, the version and SHA-256 below, which match noble universe's signed
  # index) runs the archive's own 32-bit Arm executable on the x64 runner, against the 32-bit Arm system of Microsoft's .NET 11
  # runtime-deps image (linux/arm/v7, pinned by its manifest digest), whose OpenSSL the runtime uses. Neither is installed or
  # registered: the package is unpacked into the runner's temporary folder (no sudo, no binfmt registration, no privileged
  # container) and the image is pulled and exported, never run. Read-only: no write permission; nothing is uploaded.
  emulated-smoke:
    name: Smoke test ${{ matrix.rid }} (emulated)
    needs: [verify, binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-arm, runner: ubuntu-latest, runner_arch: X64, process_arch: Arm, platform: linux/arm/v7, elf: "ELF 32-bit LSB pie executable, ARM, EABI5" }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      RID: ${{ matrix.rid }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
      EXPECTED_PROCESS_ARCH: ${{ matrix.process_arch }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ELF: ${{ matrix.elf }}
      QEMU_DEB_URL: https://archive.ubuntu.com/ubuntu/pool/universe/q/qemu/qemu-user-static_8.2.2+ds-0ubuntu1_amd64.deb
      QEMU_DEB_SHA256: 83ad62bfe0e28a5645cb6a40d8b99e7a629fdac9e1a9cea9949d1c59a01322c7
      QEMU_VERSION_LINE: "qemu-arm version 8.2.2 (Debian 1:8.2.2+ds-0ubuntu1)"
      TARGET_SYSTEM_IMAGE: mcr.microsoft.com/dotnet/runtime-deps@sha256:452ae87ad852ee92975e155546adbade8510bb9fad5658ac81d9f315d322ffd0
    steps:
      # For release-policy.sh only; the app under test comes only from the archive.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner must be the expected x64 runner: the Arm process below can then only run emulated.
      - name: Check the runner architecture
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS $RUNNER_ARCH, image ${ImageOS:-unknown} ${ImageVersion:-unknown}, $(uname -m)"
          if [ "$RUNNER_ARCH" != "$EXPECTED_RUNNER_ARCH" ]; then
            echo "::error::$RID's emulated run expects a $EXPECTED_RUNNER_ARCH runner, got $RUNNER_ARCH"; exit 1
          fi

      - name: Download the console archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-console-*-${{ matrix.rid }}.tar.gz
          merge-multiple: true
          path: dist
          skip-decompress: true

      # The pinned emulator (its package's SHA-256 checked before it is unpacked) and the pinned 32-bit Arm system (the image's
      # platform checked, then its file system exported), and the archive's executable checked to be a 32-bit Arm program.
      - name: Prepare the emulator and the 32-bit Arm system
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/qemu.deb" "$QEMU_DEB_URL"
          got="$(sha256sum "$RUNNER_TEMP/qemu.deb" | cut -d' ' -f1)"
          if [ "$got" != "$QEMU_DEB_SHA256" ]; then echo "::error::The emulator's package has SHA-256 $got, expected $QEMU_DEB_SHA256"; exit 1; fi
          dpkg-deb -x "$RUNNER_TEMP/qemu.deb" "$RUNNER_TEMP/qemu"
          version="$("$RUNNER_TEMP/qemu/usr/bin/qemu-arm-static" --version | head -n 1)"
          if [ "$version" != "$QEMU_VERSION_LINE" ]; then echo "::error::The emulator reports '$version', expected '$QEMU_VERSION_LINE'"; exit 1; fi
          echo "Emulator: $version, package $QEMU_DEB_URL, SHA-256 $got"
          docker pull --quiet --platform "$TARGET_PLATFORM" "$TARGET_SYSTEM_IMAGE"
          platform="$(docker image inspect "$TARGET_SYSTEM_IMAGE" --format '{{.Os}}/{{.Architecture}}/{{.Variant}}')"
          if [ "$platform" != "$TARGET_PLATFORM" ]; then echo "::error::The 32-bit Arm system image is $platform, expected $TARGET_PLATFORM"; exit 1; fi
          container="$(docker create --platform "$TARGET_PLATFORM" "$TARGET_SYSTEM_IMAGE" /bin/true)"
          mkdir -p "$RUNNER_TEMP/rootfs"
          docker export "$container" | tar -x -C "$RUNNER_TEMP/rootfs"
          docker rm "$container" > /dev/null
          ssl="$(awk '/^Package: libssl3/ {p = 1} p && /^Version: / {print $2; exit}' "$RUNNER_TEMP/rootfs/var/lib/dpkg/status")"
          echo "32-bit Arm system: $TARGET_SYSTEM_IMAGE ($platform), OpenSSL package ${ssl:-unknown}"
          tar -xzf "dist/campertron-console-$VERSION-$RID.tar.gz" -C "$RUNNER_TEMP"
          exe="$RUNNER_TEMP/campertron-console-$VERSION-$RID/CampertronConsole"
          kind="$(file -b "$exe")"
          echo "Executable under test: $kind"
          case "$kind" in "$TARGET_ELF"*) ;; *) echo "::error::$RID's CampertronConsole is '$kind', expected '$TARGET_ELF'"; exit 1 ;; esac
          {
            echo "### $RID (emulated)"
            echo "- Emulator: $version (Ubuntu package SHA-256 \`$got\`), user mode on a $RUNNER_ARCH runner; not native execution"
            echo "- 32-bit Arm system: \`$TARGET_SYSTEM_IMAGE\` ($platform), OpenSSL package ${ssl:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Console --version (emulated)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          dir="$RUNNER_TEMP/campertron-console-$VERSION-$RID"
          bundled="$(jq -r '.runtimeOptions.includedFrameworks[] | select(.name == "Microsoft.NETCore.App") | .version' "$dir/CampertronConsole.runtimeconfig.json")"
          output="$(timeout 120 "$RUNNER_TEMP/qemu/usr/bin/qemu-arm-static" -L "$RUNNER_TEMP/rootfs" "$dir/CampertronConsole" --version)"
          echo "$output"
          check_framework_report "$output" "$bundled"
          if ! head -n 1 <<<"$output" | grep -qE "^CampertronConsole ${VERSION//./\\.}(\+[0-9a-f]+)?\$"; then
            echo "::error::CampertronConsole --version does not report version $VERSION"; exit 1
          fi
          grep -qF "($EXPECTED_PROCESS_ARCH)" <<<"$output" || { echo "::error::CampertronConsole is not an emulated $EXPECTED_PROCESS_ARCH process"; exit 1; }

      # The self-test as in the native jobs, here an emulated 32-bit Arm process: every check required, this RID, the Arm
      # process and operating system the emulator presents, emulated execution on the x64 runner, nothing on standard error,
      # and its own new XDG_DATA_HOME and HOME still empty afterwards.
      - name: Transfer self-test (linux-arm, emulated)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          archive="dist/campertron-console-$VERSION-$RID.tar.gz"
          sum="$(sha256sum "$archive" | cut -d' ' -f1)"
          echo "Archive under test: $archive, SHA-256 $sum"
          data="$RUNNER_TEMP/selftest-data"; home="$RUNNER_TEMP/selftest-home"
          mkdir -p "$data" "$home" "$RUNNER_TEMP/smoke"
          set +e
          (cd "$home" && HOME="$home" XDG_DATA_HOME="$data" timeout 300 "$RUNNER_TEMP/qemu/usr/bin/qemu-arm-static" -L "$RUNNER_TEMP/rootfs" \
            "$RUNNER_TEMP/campertron-console-$VERSION-$RID/CampertronConsole" --transfer-selftest \
            > "$RUNNER_TEMP/smoke/transfer-selftest.out" 2> "$RUNNER_TEMP/smoke/transfer-selftest.err")
          rc=$?
          set -e
          check_transfer_selftest "$rc" "$RUNNER_TEMP/smoke/transfer-selftest.out" "$RUNNER_TEMP/smoke/transfer-selftest.err" \
            "$RID" "$EXPECTED_PROCESS_ARCH" "$EXPECTED_PROCESS_ARCH" emulated "$RUNNER_ARCH" > "$RUNNER_TEMP/smoke/transfer-selftest.txt" || { cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"; exit 1; }
          cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"
          if [ -n "$(find "$data" "$home" -mindepth 1 | head -n 1)" ]; then echo "::error::The transfer self-test created a file or folder"; exit 1; fi
          echo "- \`$RID\` console archive \`$sum\`: $(grep '^Transfer self-test evidence: ' "$RUNNER_TEMP/smoke/transfer-selftest.txt")" >> "$GITHUB_STEP_SUMMARY"

  # Builds the container image once for both platforms and exports that build as an OCI archive, which is the image
  # docker-publish pushes unchanged (decision D32). Read-only: nothing here contacts or changes a registry.
  docker:
    name: Docker build (linux/amd64, linux/arm64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    outputs:
      image_digest: ${{ steps.image.outputs.image_digest }}
      amd64_manifest: ${{ steps.image.outputs.amd64_manifest }}
      arm64_manifest: ${{ steps.image.outputs.arm64_manifest }}
      arm64_config: ${{ steps.image.outputs.arm64_config }}
      archive_sha256: ${{ steps.image.outputs.archive_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Buildx builder
        run: |
          docker buildx create --name campertron --driver docker-container --use
          docker buildx inspect --bootstrap

      # The only multi-platform build. Its OCI archive (both images and BuildKit's attestation manifests) is checked
      # below and is exactly what docker-publish pushes; it is never rebuilt.
      - name: Build both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file CampertronConsole/Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --output type=oci,dest="$RUNNER_TEMP/container-image" \
            --progress plain .

      # Both platform images are checked in the archive without running them: platforms, .NET 11, labels, user,
      # Ubuntu base, native SQLite architecture, PDB compiler provenance and one compiler for both (check_oci_image).
      - name: Check both platform images
        id: image
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          if ! result="$(check_oci_archive "$RUNNER_TEMP/container-image" "$RUNNER_TEMP/container-image.oci" "$VERSION" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"
          { echo "### Container image (validated, published unchanged by a tag run)"; echo '```'; echo "$result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Load linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load --tag campertron-smoke:local \
            --file CampertronConsole/Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" .

      # The natively tested image must be the validated amd64 image of the archive: the same image ID (manifest digest
      # with the containerd image store, config digest with the classic store) and the same layer diff_ids.
      - name: Check the loaded image is the validated amd64 image
        env:
          AMD64_MANIFEST: ${{ steps.image.outputs.amd64_manifest }}
          AMD64_CONFIG: ${{ steps.image.outputs.amd64_config }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          id="$(docker image inspect campertron-smoke:local --format '{{.Id}}')"
          layers="$(docker image inspect campertron-smoke:local --format '{{json .RootFS.Layers}}')"
          if ! result="$(check_loaded_image "$id" "$layers" "$RUNNER_TEMP/container-image.oci" "$AMD64_MANIFEST" "$AMD64_CONFIG")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"

      # The settings-transfer package's compatibility self-test (TD-69) inside the validated amd64 image, natively: the image's
      # .NET 11 runtime and its system's OpenSSL, a read-only root file system, no network and no /config or /cache (the
      # self-test reads and writes no settings), fixed facts only, every check required (check_transfer_selftest).
      - name: Container transfer self-test
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          platform="$(docker image inspect campertron-smoke:local --format '{{.Os}}/{{.Architecture}}')"
          echo "Image under test: campertron-smoke:local, $platform, $(docker image inspect campertron-smoke:local --format '{{.Id}}')"
          if [ "$platform" != linux/amd64 ]; then echo "::error::The image under test is $platform, expected linux/amd64"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/smoke"
          set +e
          docker run --rm --network none --read-only campertron-smoke:local --transfer-selftest \
            > "$RUNNER_TEMP/smoke/transfer-selftest.out" 2> "$RUNNER_TEMP/smoke/transfer-selftest.err"
          rc=$?
          set -e
          check_transfer_selftest "$rc" "$RUNNER_TEMP/smoke/transfer-selftest.out" "$RUNNER_TEMP/smoke/transfer-selftest.err" \
            linux-x64 X64 X64 native "$RUNNER_ARCH" > "$RUNNER_TEMP/smoke/transfer-selftest.txt" || { cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"; exit 1; }
          cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"
          echo "- linux/amd64 image (the validated archive's amd64 image): $(grep '^Transfer self-test evidence: ' "$RUNNER_TEMP/smoke/transfer-selftest.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Container smoke tests
        run: |
          set -euo pipefail
          # Without /config the app must refuse to start (container mode is detected).
          set +e
          output="$(docker run --rm campertron-smoke:local 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || ! grep -q "Config path does not exist" <<<"$output"; then
            echo "$output"
            echo "::error::Expected 'Config path does not exist' and a non-zero exit, got exit $rc"
            exit 1
          fi
          # With /config and /cache the bundled database is extracted inside the container.
          root="$RUNNER_TEMP/container"
          mkdir -p "$root/config" "$root/cache"
          printf 'outputTo: UnitTest\nrefreshRidbDataDayInterval: 30\nlastRidbDataRefresh: 2026-01-01T00:00:00.0000000Z\nautoRefresh: false\n' > "$root/config/General.yaml"
          chmod -R a+rwX "$root"
          docker run --rm --volume "$root/config:/config" --volume "$root/cache:/cache" campertron-smoke:local
          size="$(stat -c %s "$root/config/RecreationDotOrg.db")"
          echo "Database extracted in the container: $size bytes"
          if [ "$size" -lt 100000000 ]; then echo "::error::Extracted database is too small"; exit 1; fi
          label="$(docker image inspect campertron-smoke:local --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          if [ "$label" != "$VERSION" ]; then echo "::error::Image version label is '$label', expected '$VERSION'"; exit 1; fi

      # The image must build and run on .NET 11: the runtime image's DOTNET_VERSION, the console's
      # runtimeconfig (framework-dependent, tfm net11.0 on Microsoft.NETCore.App 11.x), the
      # FrameworkDescription the containerized console reports with --version, and the portable PDBs in the
      # image, which prove that the SDK build stage compiled with an SDK 11 compiler.
      - name: Container runs on .NET 11
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          env_version="$(docker image inspect campertron-smoke:local --format '{{ range .Config.Env }}{{ println . }}{{ end }}' | sed -n 's/^DOTNET_VERSION=//p')"
          echo "Image DOTNET_VERSION: $env_version"
          case "$env_version" in "$DOTNET_MAJOR_REQUIRED".*) ;; *) echo "::error::Image DOTNET_VERSION is '$env_version', expected $DOTNET_MAJOR_REQUIRED.x"; exit 1 ;; esac
          docker run --rm --entrypoint cat campertron-smoke:local /app/CampertronConsole.runtimeconfig.json > "$RUNNER_TEMP/image.runtimeconfig.json"
          check_framework_dependent_runtimeconfig "$RUNNER_TEMP/image.runtimeconfig.json"
          output="$(docker run --rm campertron-smoke:local --version)"
          echo "$output"
          check_framework_report "$output" "$env_version"
          mkdir -p "$RUNNER_TEMP/image-pdb"
          for pdb in CampertronLibrary.pdb CampertronConsole.pdb; do
            docker run --rm --entrypoint cat campertron-smoke:local "/app/$pdb" > "$RUNNER_TEMP/image-pdb/$pdb"
          done
          # Assign first: a failed check inside echo "$(...)" would not fail the step. On failure, print its ::error:: line.
          if ! compiler="$(check_pdb_provenance "$RUNNER_TEMP/image-pdb" CampertronConsole)"; then
            echo "$compiler"
            exit 1
          fi
          echo "Image compiler: $compiler"

      # Web mode's release smoke test (D102) in the validated amd64 image: `--web` in a container with new /config and
      # /cache folders, its port published on 127.0.0.1 only, the same checks as the native ones (and --healthcheck inside
      # the container, as Compose runs it), then docker stop with exit code 0. The image is never pulled or pushed.
      - name: Container web mode smoke test
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -I .github/release-policy/web-smoke.py container --image campertron-smoke:local --version "$VERSION" --icon assets/icon/campertron.ico

      # Non-publishing rehearsal of the publication copy, without any registry: skopeo copies the complete archive into
      # a local OCI layout and must keep the image index digest and every manifest (both images and the attestations)
      # and blob unchanged, and `skopeo inspect --raw` must return exactly the index bytes that docker-publish compares.
      - name: Rehearse the publication copy (no registry)
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          skopeo --version
          rm -rf "$RUNNER_TEMP/rehearsal"
          skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/container-image" "oci:$RUNNER_TEMP/rehearsal:rehearsal"
          if ! result="$(check_oci_copy "$RUNNER_TEMP/rehearsal" rehearsal "$IMAGE_DIGEST")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"
          skopeo inspect --raw "oci:$RUNNER_TEMP/rehearsal:rehearsal" > "$RUNNER_TEMP/rehearsal-index.json"
          raw="sha256:$(sha256sum < "$RUNNER_TEMP/rehearsal-index.json" | cut -d' ' -f1)"
          if [ "$raw" != "$IMAGE_DIGEST" ]; then echo "::error::skopeo inspect --raw returned $raw, expected $IMAGE_DIGEST"; exit 1; fi
          echo "skopeo inspect --raw returns the validated image index $raw"

      # The validated archive itself, uploaded as one file (no re-compression); the artifact is named after the file.
      - name: Upload the validated image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/container-image
          archive: false
          if-no-files-found: error
          retention-days: ${{ needs.verify.outputs.publish == 'true' && 7 || 1 }}

  # The linux/arm64 image of the validated archive, run natively (S2). The docker job runs only the amd64 image; this
  # job loads the arm64 image from the same archive that a tag run publishes (never a rebuild), requires it to be the
  # validated image (the same config and layer diff_ids) and runs the container checks on an arm64 runner. Read-only:
  # nothing here contacts or changes a registry.
  container-smoke:
    name: Container smoke test linux/arm64 (native)
    needs: [verify, docker]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
      ARM64_MANIFEST: ${{ needs.docker.outputs.arm64_manifest }}
      ARM64_CONFIG: ${{ needs.docker.outputs.arm64_config }}
      IMAGE_SHA256: ${{ needs.docker.outputs.archive_sha256 }}
    steps:
      # For release-policy.sh only; the image under test comes only from the docker job's archive.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the arm64 runner architecture
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS $RUNNER_ARCH, image ${ImageOS:-unknown} ${ImageVersion:-unknown}, $(uname -m)"
          if [ "$RUNNER_ARCH" != "ARM64" ]; then echo "::error::The linux/arm64 image must run on a native ARM64 runner, got $RUNNER_ARCH"; exit 1; fi
          docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}'
          docker info --format 'Image store: {{.Driver}} {{.DriverStatus}}'

      - name: Download the validated image for the arm64 run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
          path: image
          skip-decompress: true

      # The file must be the archive the docker job validated (file SHA-256, image index, arm64 manifest and config),
      # and the complete image check runs again on it, here on the arm64 runner.
      - name: Check the validated image before the arm64 run
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          got="$(sha256sum < image/container-image | cut -d' ' -f1)"
          if [ "$got" != "$IMAGE_SHA256" ]; then echo "::error::Downloaded image archive has SHA-256 $got, expected $IMAGE_SHA256"; exit 1; fi
          if ! result="$(check_oci_archive image/container-image "$RUNNER_TEMP/container-image.oci" "$VERSION" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"
          for expected in "image_digest=$IMAGE_DIGEST" "arm64_manifest=$ARM64_MANIFEST" "arm64_config=$ARM64_CONFIG" "archive_sha256=$IMAGE_SHA256"; do
            if ! grep -qxF -- "$expected" <<< "$result"; then echo "::error::Downloaded image does not match the docker job's validated ${expected%%=*}"; exit 1; fi
          done

      # skopeo copies the archive's linux/arm64 image into the local Docker daemon; no registry is involved.
      - name: Load the linux/arm64 image from the validated archive
        run: |
          set -euo pipefail
          command -v skopeo > /dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          skopeo --version
          skopeo copy --override-os linux --override-arch arm64 "oci-archive:image/container-image" "docker-daemon:campertron-smoke-arm64:local"

      # The image Docker runs must be the validated arm64 image: its architecture, its config blob (read from a
      # `docker save` of it) and its layer diff_ids. The image ID is not compared, because a loaded image can get a
      # manifest of Docker's own (containerd image store).
      - name: Check the loaded image is the validated arm64 image
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          arch="$(docker image inspect campertron-smoke-arm64:local --format '{{.Architecture}}')"
          layers="$(docker image inspect campertron-smoke-arm64:local --format '{{json .RootFS.Layers}}')"
          docker save campertron-smoke-arm64:local --output "$RUNNER_TEMP/loaded-arm64.tar"
          if ! saved="$(saved_image_config "$RUNNER_TEMP/loaded-arm64.tar")"; then
            echo "$saved"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/loaded-arm64.tar"
          if ! result="$(check_loaded_platform_image arm64 "$arch" "$saved" "$layers" "$RUNNER_TEMP/container-image.oci" "$ARM64_MANIFEST" "$ARM64_CONFIG")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"

      # The settings-transfer package's compatibility self-test (TD-69) inside the validated arm64 image, natively, as the docker
      # job runs it in the amd64 image: read-only, no network, no /config or /cache, fixed facts only, every check required.
      - name: Container transfer self-test (linux/arm64)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          platform="$(docker image inspect campertron-smoke-arm64:local --format '{{.Os}}/{{.Architecture}}')"
          echo "Image under test: campertron-smoke-arm64:local, $platform (config $ARM64_CONFIG of the validated archive)"
          if [ "$platform" != linux/arm64 ]; then echo "::error::The image under test is $platform, expected linux/arm64"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/smoke"
          set +e
          docker run --rm --network none --read-only campertron-smoke-arm64:local --transfer-selftest \
            > "$RUNNER_TEMP/smoke/transfer-selftest.out" 2> "$RUNNER_TEMP/smoke/transfer-selftest.err"
          rc=$?
          set -e
          check_transfer_selftest "$rc" "$RUNNER_TEMP/smoke/transfer-selftest.out" "$RUNNER_TEMP/smoke/transfer-selftest.err" \
            linux-arm64 Arm64 Arm64 native "$RUNNER_ARCH" > "$RUNNER_TEMP/smoke/transfer-selftest.txt" || { cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"; exit 1; }
          cat "$RUNNER_TEMP/smoke/transfer-selftest.txt"
          echo "- linux/arm64 image (the validated archive's arm64 image): $(grep '^Transfer self-test evidence: ' "$RUNNER_TEMP/smoke/transfer-selftest.txt")" >> "$GITHUB_STEP_SUMMARY"

      # The same checks the docker job runs on the amd64 image, in a native arm64 container.
      - name: Container smoke tests (linux/arm64)
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image=campertron-smoke-arm64:local
          # Without /config the app must refuse to start (container mode is detected).
          set +e
          output="$(docker run --rm "$image" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || ! grep -q "Config path does not exist" <<<"$output"; then
            echo "$output"
            echo "::error::Expected 'Config path does not exist' and a non-zero exit, got exit $rc"
            exit 1
          fi
          # With /config and /cache the bundled database is extracted inside the container.
          root="$RUNNER_TEMP/container"
          mkdir -p "$root/config" "$root/cache"
          printf 'outputTo: UnitTest\nrefreshRidbDataDayInterval: 30\nlastRidbDataRefresh: 2026-01-01T00:00:00.0000000Z\nautoRefresh: false\n' > "$root/config/General.yaml"
          chmod -R a+rwX "$root"
          docker run --rm --volume "$root/config:/config" --volume "$root/cache:/cache" "$image"
          size="$(stat -c %s "$root/config/RecreationDotOrg.db")"
          echo "Database extracted in the arm64 container: $size bytes"
          if [ "$size" -lt 100000000 ]; then echo "::error::Extracted database is too small"; exit 1; fi
          label="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          if [ "$label" != "$VERSION" ]; then echo "::error::Image version label is '$label', expected '$VERSION'"; exit 1; fi
          # The containerized console runs on the image's .NET 11 runtime, in an arm64 process.
          env_version="$(docker image inspect "$image" --format '{{ range .Config.Env }}{{ println . }}{{ end }}' | sed -n 's/^DOTNET_VERSION=//p')"
          echo "Image DOTNET_VERSION: $env_version"
          case "$env_version" in "$DOTNET_MAJOR_REQUIRED".*) ;; *) echo "::error::Image DOTNET_VERSION is '$env_version', expected $DOTNET_MAJOR_REQUIRED.x"; exit 1 ;; esac
          output="$(docker run --rm "$image" --version)"
          echo "$output"
          check_framework_report "$output" "$env_version"
          grep -qF "(Arm64)" <<<"$output" || { echo "::error::The containerized console is not an Arm64 process"; exit 1; }
          machine="$(docker run --rm --entrypoint uname "$image" -m)"
          echo "Container machine: $machine"
          if [ "$machine" != "aarch64" ]; then echo "::error::The container reports the machine '$machine', expected aarch64"; exit 1; fi

      # Web mode's release smoke test (D102) in the validated arm64 image, natively, as the docker job runs it on amd64.
      - name: Container web mode smoke test (linux/arm64)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -I .github/release-policy/web-smoke.py container --image campertron-smoke-arm64:local --version "$VERSION" --icon assets/icon/campertron.ico

  # Builds the complete release payload on every run (pull request, manual dry run and tag), with
  # read-only permissions: the 16 archives are checked by name, SHA256SUMS.txt is generated and
  # verified, and the release notes are rendered and validated. The output is uploaded as the
  # "release-metadata" artifact, which the tag-only release job publishes unchanged.
  assemble:
    name: Assemble release (checksums, notes)
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-*
          merge-multiple: true
          path: dist
          # Keep each archive exactly as uploaded; without this, .zip archives are extracted on download.
          skip-decompress: true

      # Every expected archive exactly once, as a file, and nothing else. (Artifact names are unique within
      # a run, so a duplicate upload cannot reach this point; an extra, missing, renamed or extracted
      # archive fails here.)
      - name: Check archive names
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          expected="$RUNNER_TEMP/expected.txt"
          expected_archives "$VERSION" > "$expected"
          (cd dist && ls -1) | sort > "$RUNNER_TEMP/actual.txt"
          if ! diff -u "$expected" "$RUNNER_TEMP/actual.txt"; then
            echo "::error::dist/ does not contain exactly the 16 expected archives (see diff above)"
            exit 1
          fi
          dupes="$(sort "$RUNNER_TEMP/actual.txt" | uniq -d)"
          if [ -n "$dupes" ]; then echo "::error::Duplicate archives: $dupes"; exit 1; fi
          echo "All 16 expected archives present exactly once."

      # All 16 archives must come from one toolchain: the compiler and compiler runtime recorded in each archive's
      # CampertronLibrary.pdb (beta.8 and beta.9 mixed SDK 10 and SDK 11 builds across jobs; decision D31).
      - name: Check one toolchain for all archives
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          list="$RUNNER_TEMP/toolchains.txt"; : > "$list"
          for archive in $(cd dist && ls -1 | sort); do
            pdb="$RUNNER_TEMP/$archive.CampertronLibrary.pdb"
            case "$archive" in
              *.zip)    unzip -p "dist/$archive" '*/CampertronLibrary.pdb' > "$pdb" ;;
              *.tar.gz) tar -xzf "dist/$archive" --wildcards -O '*/CampertronLibrary.pdb' > "$pdb" ;;
            esac
            [ -s "$pdb" ] || { echo "::error::$archive has no CampertronLibrary.pdb"; exit 1; }
            echo "$archive $(pdb_option "$pdb" compiler-version) $(pdb_option "$pdb" runtime-version)" >> "$list"
          done
          cat "$list"
          check_single_toolchain "$list"
          echo "All $(wc -l < "$list") archives were compiled by: $(awk '{print $2" on .NET "$3}' "$list" | sort -u)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          mkdir -p release
          (cd dist && sha256sum -- $(ls -1 | sort)) > release/SHA256SUMS.txt
          lines="$(wc -l < release/SHA256SUMS.txt)"
          if [ "$lines" -ne 16 ]; then echo "::error::SHA256SUMS.txt has $lines lines, expected 16"; exit 1; fi
          (cd dist && sha256sum --check --strict ../release/SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      # Publishing tag: the reviewed fragment .github/release-notes/v<version>.md composed with the generated
      # sections (required; no template fallback). Dry run: the template for the synthetic version.
      - name: Render release notes
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          assemble_release_notes "$PUBLISH" "$VERSION" "$PRERELEASE" "$image" "$GITHUB_REPOSITORY" .github/release-notes > release/RELEASE_NOTES.md
          {
            if [ "$PUBLISH" = "true" ]; then
              echo "### Release notes: \`$(curated_notes_path "$VERSION")\` composed with the generated sections"
            else
              echo "### Release notes: dry run, template only"
              echo "Version \`$VERSION\` is synthetic and has no curated fragment. Template-only notes are permitted only because this run cannot publish; a publishing tag requires \`.github/release-notes/v<version>.md\`. The real fragments are checked and previewed by the Release verify job."
            fi
            echo "- SHA-256: \`$(sha256sum < release/RELEASE_NOTES.md | cut -d' ' -f1)\` ($(wc -c < release/RELEASE_NOTES.md | tr -d ' ') bytes)"
            echo
            cat release/RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release notes
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          validate_notes release/RELEASE_NOTES.md "$VERSION" "$PRERELEASE" "$image" "$RUNNER_TEMP/expected.txt"
          if [ "$PUBLISH" = "true" ] && [ "$(sed -n 5p release/RELEASE_NOTES.md)" != "## What's new in $VERSION" ]; then
            echo "::error::Publishing notes for $VERSION do not contain the curated fragment"
            exit 1
          fi
          echo "Release notes validated."

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  # Publishing jobs. Each is gated twice: verify must have decided to publish, AND the triggering event
  # itself must be a push of a v* tag, so pull requests and manual runs can never reach them.
  docker-publish:
    name: Publish image to GHCR
    needs: [verify, binaries, smoke, native-smoke, emulated-smoke, docker, container-smoke, assemble]
    if: needs.verify.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
      AMD64_MANIFEST: ${{ needs.docker.outputs.amd64_manifest }}
      ARM64_MANIFEST: ${{ needs.docker.outputs.arm64_manifest }}
      IMAGE_SHA256: ${{ needs.docker.outputs.archive_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tags: always the exact version; stable releases also get MAJOR.MINOR and latest. SemVer pre-release versions get only
      # the exact version and never read or move latest (docker_tag_args/docker_tag_refs in .github/release-policy/release-policy.sh).
      - name: Determine image name and tags
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          docker_tag_refs "$image" "$VERSION" "$PRERELEASE" > "$RUNNER_TEMP/image-refs.txt"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Image references:"
          cat "$RUNNER_TEMP/image-refs.txt"

      # The image is the docker job's validated OCI archive, never a new build.
      - name: Download the validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
          path: image
          skip-decompress: true

      # Before any registry request: the file must be the archive the docker job validated (file SHA-256, image index
      # and both platform manifests), and the complete image check runs again on it.
      - name: Check the validated image before registry contact
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          got="$(sha256sum < image/container-image | cut -d' ' -f1)"
          if [ "$got" != "$IMAGE_SHA256" ]; then echo "::error::Downloaded image archive has SHA-256 $got, expected $IMAGE_SHA256"; exit 1; fi
          if ! result="$(check_oci_archive image/container-image "$RUNNER_TEMP/container-image.oci" "$VERSION" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"
          for expected in "image_digest=$IMAGE_DIGEST" "amd64_manifest=$AMD64_MANIFEST" "arm64_manifest=$ARM64_MANIFEST" "archive_sha256=$IMAGE_SHA256"; do
            if ! grep -qxF -- "$expected" <<< "$result"; then echo "::error::Downloaded image does not match the docker job's validated ${expected%%=*}"; exit 1; fi
          done

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Pushes the validated bytes unchanged (skopeo copy --all --preserve-digests) with the credentials docker login
      # stored (publish_oci_archive, decision D59). Every tag is checked before anything is copied: the exact version is
      # created or already the validated digest, never moved; a stable version's MAJOR.MINOR and latest are created, kept,
      # or moved forward only from an image whose version label is an older stable version, never backward. The exact
      # version is pushed and read back first, then the floating tags; every tag is read back again at the end.
      - name: Push the validated image
        id: push
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          mapfile -t refs < "$RUNNER_TEMP/image-refs.txt"
          if ! result="$(publish_oci_archive image/container-image "$IMAGE_DIGEST" "$AMD64_MANIFEST" "$ARM64_MANIFEST" "$HOME/.docker/config.json" "$VERSION" "$PRERELEASE" "${refs[@]}")"; then
            echo "$result"
            exit 1
          fi
          echo "$result"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.docker.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Publishes exactly what the assemble job validated: the 16 archives, its SHA256SUMS.txt and its
  # rendered notes. Nothing is regenerated here; the archives are only re-checked against SHA256SUMS.txt.
  release:
    name: Create GitHub release
    needs: [verify, binaries, smoke, native-smoke, emulated-smoke, docker, container-smoke, assemble, docker-publish]
    if: needs.verify.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-*
          merge-multiple: true
          path: dist
          # Keep each archive exactly as uploaded; without this, .zip archives are extracted on download.
          skip-decompress: true

      - name: Download validated release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: release

      # The assembled SHA256SUMS.txt must cover exactly the downloaded archives, byte for byte.
      - name: Verify archives against the assembled checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict ../release/SHA256SUMS.txt)
          listed="$(awk '{print $2}' release/SHA256SUMS.txt | sort)"
          present="$(cd dist && ls -1 | sort)"
          if [ "$listed" != "$present" ] || [ "$(echo "$present" | wc -l)" -ne 16 ]; then
            echo "::error::Downloaded archives do not match SHA256SUMS.txt"
            exit 1
          fi
          if ! head -n 1 release/RELEASE_NOTES.md | grep -qxF "# Campertron $VERSION"; then
            echo "::error::RELEASE_NOTES.md was not assembled for version $VERSION"
            exit 1
          fi
          cp release/SHA256SUMS.txt dist/SHA256SUMS.txt

      # The notes to publish must be exactly the reviewed fragment of the tagged commit composed with the generated
      # sections: rebuilt here from this checkout and compared byte for byte with the assembled copy.
      - name: Reconstruct the approved release notes from the tagged commit
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          expected_archives "$VERSION" > "$RUNNER_TEMP/expected.txt"
          assemble_release_notes true "$VERSION" "$PRERELEASE" "$image" "$GITHUB_REPOSITORY" .github/release-notes > "$RUNNER_TEMP/RELEASE_NOTES.tagged.md"
          compare_release_body "$RUNNER_TEMP/RELEASE_NOTES.tagged.md" release/RELEASE_NOTES.md "release-metadata RELEASE_NOTES.md"
          if [ "$(sed -n 5p release/RELEASE_NOTES.md)" != "## What's new in $VERSION" ]; then
            echo "::error::RELEASE_NOTES.md does not contain the curated fragment for $VERSION"
            exit 1
          fi
          validate_notes release/RELEASE_NOTES.md "$VERSION" "$PRERELEASE" "$image" "$RUNNER_TEMP/expected.txt"
          echo "Approved release notes: $(curated_notes_path "$VERSION") composed, SHA-256 $(sha256sum < release/RELEASE_NOTES.md | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Draft first, with every asset attached and the approved notes, then publish as a normal release marked
      # Latest (also for SemVer pre-release versions; GitHub does not allow a prerelease to be Latest). A failure
      # before publishing leaves only a draft.
      - name: Create draft release with assets and approved notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          tag="v$VERSION"
          read -r -a flags <<< "$(github_release_flags "$PRERELEASE")"
          gh release create "$tag" dist/* --draft --verify-tag --title "Campertron $VERSION" \
            --notes-file release/RELEASE_NOTES.md "${flags[@]}"
          assets="$(gh release view "$tag" --json assets --jq '.assets | length')"
          if [ "$assets" -ne 17 ]; then
            echo "::error::Draft release has $assets assets, expected 17; leaving it as a draft"
            exit 1
          fi

      # The stored draft body is read back without --jq (which would append a newline) and must equal the approved
      # notes byte for byte; the release must still be a draft with the expected title, tag and 17 assets.
      - name: Check the draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          tag="v$VERSION"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          gh release view "$tag" --json body,isDraft,isPrerelease,name,tagName,assets > "$RUNNER_TEMP/draft.json"
          if ! check_release_view "$RUNNER_TEMP/draft.json" release/RELEASE_NOTES.md "$VERSION" true "$image" "$RUNNER_TEMP/expected.txt"; then
            echo "::error::$tag is left as an unpublished draft for the maintainer to inspect"
            exit 1
          fi
          echo "Draft body is byte-identical to the approved notes."

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          tag="v$VERSION"
          read -r -a flags <<< "$(github_release_flags "$PRERELEASE")"
          gh release edit "$tag" --draft=false "${flags[@]}"
          gh release view "$tag" --json url,isPrerelease,isDraft --jq '"Published \(.url) (prerelease: \(.isPrerelease), draft: \(.isDraft))"'

      # A mismatch here is reported, never repaired automatically: correcting a published body needs the
      # maintainer's explicit approval.
      - name: Check the release is a normal release marked Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          tag="v$VERSION"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          state="$(gh release view "$tag" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "prerelease draft: $state; repository latest: $latest"
          if [ "$state" != "false false" ] || [ "$latest" != "$tag" ]; then
            echo "::error::$tag is published but is not a normal release marked Latest"
            exit 1
          fi
          gh release view "$tag" --json body,isDraft,isPrerelease,name,tagName,assets > "$RUNNER_TEMP/public.json"
          if ! check_release_view "$RUNNER_TEMP/public.json" release/RELEASE_NOTES.md "$VERSION" false "$image" "$RUNNER_TEMP/expected.txt"; then
            echo "::error::The published body of $tag differs from the approved notes; not repaired automatically (maintainer-directed recovery)"
            exit 1
          fi
          echo "Published body is byte-identical to the approved notes (SHA-256 $(sha256sum < release/RELEASE_NOTES.md | cut -d' ' -f1))."
