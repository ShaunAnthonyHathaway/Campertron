name: Release

# Publishes a release only when a SemVer tag (vMAJOR.MINOR.PATCH[-prerelease]) that points to a commit on
# master is pushed. Every published version becomes a normal GitHub release marked Latest; a SemVer
# pre-release (hyphenated) version is still a pre-release for Docker aliases and release-note wording
# (policy and tests: .github/release-policy/). Manual runs and pull requests that touch release inputs are dry runs: they build,
# package and smoke-test everything but publish nothing. See docs/ai-context/build-and-test.md
# §Release workflow.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
      - "CampertronConsole/Dockerfile"
      - ".dockerignore"
      - "**/*.csproj"
      - "Campertron.sln"
      - "CampertronLibrary/content/**"
      - ".github/release-policy/**"

# Least privilege: every job reads the repository only, unless it grants itself more below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: Release verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tag push: the tag must be SemVer, point to a commit on master and not have a release yet.
      # Anything else is a dry run with version 0.0.0-dryrun.<run number>.
      - name: Determine version and mode
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if ! [[ "$REF_NAME" =~ $semver ]]; then
              echo "::error::Tag $REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::Tag $REF_NAME points to $GITHUB_SHA, which is not on master"
              exit 1
            fi
            if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::A GitHub release for $REF_NAME already exists"
              exit 1
            fi
            version="${REF_NAME#v}"
            publish=true
          else
            version="0.0.0-dryrun.${RUN_NUMBER}"
            publish=false
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release mode"
            echo "- Version: \`$version\`"
            echo "- Prerelease: $prerelease"
            echo "- Publish: $publish (dry run unless a release tag on master was pushed)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Prerelease and stable behaviour of the release policy (Docker tags, GitHub release flags,
      # release notes); runs on every trigger, including pull-request and manual dry runs.
      - name: Test release policy
        run: bash .github/release-policy/test-release-policy.sh

      # Every .csproj targets exactly net10.0 (no TargetFrameworks, RuntimeFrameworkVersion or RollForward),
      # any global.json pins a 10.x SDK, and the Dockerfile uses .NET 10.0 SDK and runtime images.
      - name: Check projects target .NET 10
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_project_frameworks .
          echo "All projects, build properties and Docker base images are .NET 10."

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Campertron.sln -p:Configuration=Release

      - name: Build (Release)
        run: dotnet build Campertron.sln --configuration Release --no-restore

      # Integration tests (recreation.gov, embedded DB); isolated as in ci.yml. A failure blocks the release.
      - name: Test (Release)
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/campertron-data
        timeout-minutes: 15
        run: |
          mkdir -p "$XDG_DATA_HOME"
          dotnet test Campertron.sln --configuration Release --no-build --blame-hang-timeout 10m

      - name: Vulnerability scan
        run: |
          set -euo pipefail
          mapfile -t projects < <(dotnet sln Campertron.sln list | grep -E '\.csproj$')
          total=0
          for project in "${projects[@]}"; do
            json="$(dotnet list "$project" package --vulnerable --include-transitive --format json)"
            count="$(jq '[.projects[]?.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[]] | length' <<<"$json")"
            echo "Vulnerable packages in $project: $count"
            total=$((total + count))
          done
          if [ "$total" -gt 0 ]; then
            echo "::error::$total vulnerable package(s) found"
            exit 1
          fi

  binaries:
    name: Package ${{ matrix.app.name }} ${{ matrix.rid }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: console, project: CampertronConsole }
          - { name: gui, project: CampertronGUI }
        rid: [linux-arm, linux-arm64, linux-x64, osx-arm64, osx-x64, win-arm64, win-x64, win-x86]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      APP: ${{ matrix.app.name }}
      PROJECT: ${{ matrix.app.project }}
      RID: ${{ matrix.rid }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Self-contained, not single-file, not trimmed (EF Core, YamlDotNet and ReactiveUI use reflection).
      - name: Publish
        run: |
          dotnet publish "$PROJECT/$PROJECT.csproj" --configuration Release --runtime "$RID" \
            --self-contained true -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true \
            --output "publish/$PROJECT"

      - name: Check package contents
        run: |
          set -euo pipefail
          dir="publish/$PROJECT"
          case "$RID" in
            win-*)   host="$PROJECT.exe"; sqlite="e_sqlite3.dll";      compression="System.IO.Compression.Native.dll" ;;
            osx-*)   host="$PROJECT";     sqlite="libe_sqlite3.dylib"; compression="libSystem.IO.Compression.Native.dylib" ;;
            linux-*) host="$PROJECT";     sqlite="libe_sqlite3.so";    compression="libSystem.IO.Compression.Native.so" ;;
          esac
          for file in "$host" CampertronLibrary.dll "$sqlite" "$compression"; do
            if [ ! -f "$dir/$file" ]; then
              echo "::error::$RID $APP package is missing $file"
              exit 1
            fi
          done
          echo "$RID $APP: $(find "$dir" -type f | wc -l) files, $(du -sm "$dir" | cut -f1) MB"

      # The output that becomes the archive must be a self-contained .NET 10 app: runtimeconfig (tfm net10.0,
      # Microsoft.NETCore.App 10.x only), deps.json (.NETCoreApp v10.0/<rid>, 10.x runtime pack) and a .NET 10
      # System.Private.CoreLib.dll, with no .NET 9 reference in any JSON file.
      - name: Check .NET 10 runtime
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_publish_runtime "publish/$PROJECT" "$PROJECT" "$RID"
          echo "$RID $APP: .NET 10 runtime $(jq -r '.runtimeOptions.includedFrameworks[] | select(.name == "Microsoft.NETCore.App") | .version' "publish/$PROJECT/$PROJECT.runtimeconfig.json")"

      # ZIP for Windows, tar.gz (keeps the executable bit) for Linux and macOS. Each archive has one top-level folder.
      - name: Create archive
        run: |
          set -euo pipefail
          base="campertron-${APP}-${VERSION}-${RID}"
          mkdir -p staging dist
          mv "publish/$PROJECT" "staging/$base"
          case "$RID" in
            win-*)
              command -v zip > /dev/null || { sudo apt-get update && sudo apt-get install -y zip; }
              (cd staging && zip -q -r -X "../dist/$base.zip" "$base")
              archive="dist/$base.zip"
              ;;
            *)
              tar -C staging --sort=name --owner=0 --group=0 --numeric-owner -czf "dist/$base.tar.gz" "$base"
              archive="dist/$base.tar.gz"
              ;;
          esac
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          ls -l "$archive"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test linux-x64 (native)
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # For release-policy.sh and the ReleaseCheck tool; the apps under test come only from the archives.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download linux-x64 archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-*-linux-x64.tar.gz
          merge-multiple: true
          path: dist
          # Keep each archive exactly as uploaded; without this, .zip archives are extracted on download.
          skip-decompress: true

      # Clean install: the bundled Brotli database is extracted and the console exits (outputTo: UnitTest).
      - name: Console clean install
        run: |
          set -euo pipefail
          tar -xzf "dist/campertron-console-$VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP"
          data="$RUNNER_TEMP/console-data"
          mkdir -p "$data/CampertronConfig"
          printf 'outputTo: UnitTest\nrefreshRidbDataDayInterval: 30\nlastRidbDataRefresh: 2026-01-01T00:00:00.0000000Z\nautoRefresh: false\n' > "$data/CampertronConfig/General.yaml"
          XDG_DATA_HOME="$data" timeout 120 "$RUNNER_TEMP/campertron-console-$VERSION-linux-x64/CampertronConsole"
          db="$data/CampertronConfig/RecreationDotOrg.db"
          size="$(stat -c %s "$db")"
          echo "Extracted database: $size bytes"
          if [ "$size" -lt 100000000 ]; then echo "::error::Extracted database is too small"; exit 1; fi
          if ls "$data/CampertronConfig" | grep -q partial; then echo "::error::Partial extraction file left behind"; exit 1; fi

      # The GUI must still be running after 30 s under a virtual display (timeout exits 124).
      - name: GUI starts
        run: |
          set -euo pipefail
          command -v xvfb-run > /dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          tar -xzf "dist/campertron-gui-$VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP"
          data="$RUNNER_TEMP/gui-data"
          mkdir -p "$data"
          set +e
          XDG_DATA_HOME="$data" timeout --kill-after=10 30 xvfb-run -a "$RUNNER_TEMP/campertron-gui-$VERSION-linux-x64/CampertronGUI"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then echo "::error::GUI exited early with code $rc"; exit 1; fi
          test -f "$data/CampertronConfig/RecreationDotOrg.db"

      # `--version` prints RuntimeInformation.FrameworkDescription of the running process. Both published apps
      # must report .NET 10, exactly the runtime bundled in the archive, and the version being released.
      # It needs no display and reads or creates no data.
      - name: Runtime reported by the published apps
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          for project in CampertronConsole CampertronGUI; do
            case "$project" in CampertronConsole) app=console ;; *) app=gui ;; esac
            dir="$RUNNER_TEMP/campertron-$app-$VERSION-linux-x64"
            bundled="$(jq -r '.runtimeOptions.includedFrameworks[] | select(.name == "Microsoft.NETCore.App") | .version' "$dir/$project.runtimeconfig.json")"
            output="$(env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 "$dir/$project" --version)"
            echo "$output"
            check_framework_report "$output" "$bundled"
            if ! head -n 1 <<<"$output" | grep -qE "^$project ${VERSION//./\\.}(\+[0-9a-f]+)?\$"; then
              echo "::error::$project --version does not report version $VERSION"; exit 1
            fi
          done

      # The published CampertronLibrary.dll runs its own GUI queries (By City / By State) and the refresh
      # validation against the database that each published app extracted from its embedded resource:
      # two-letter states only, no ZIP codes such as 01005, MA lists BARRE, Corrected layout, validation passes.
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: GUI state data (published library and database)
        run: |
          set -euo pipefail
          dotnet build .github/release-policy/ReleaseCheck/ReleaseCheck.csproj --configuration Release --output "$RUNNER_TEMP/releasecheck"
          dotnet "$RUNNER_TEMP/releasecheck/ReleaseCheck.dll" "$RUNNER_TEMP/campertron-gui-$VERSION-linux-x64" "$RUNNER_TEMP/gui-data/CampertronConfig"
          dotnet "$RUNNER_TEMP/releasecheck/ReleaseCheck.dll" "$RUNNER_TEMP/campertron-console-$VERSION-linux-x64" "$RUNNER_TEMP/console-data/CampertronConfig"

  docker:
    name: Docker build (linux/amd64, linux/arm64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Buildx builder
        run: |
          docker buildx create --name campertron --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file CampertronConsole/Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --progress plain .

      - name: Load linux/amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load --tag campertron-smoke:local \
            --file CampertronConsole/Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" .

      - name: Container smoke tests
        run: |
          set -euo pipefail
          # Without /config the app must refuse to start (container mode is detected).
          set +e
          output="$(docker run --rm campertron-smoke:local 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || ! grep -q "Config path does not exist" <<<"$output"; then
            echo "$output"
            echo "::error::Expected 'Config path does not exist' and a non-zero exit, got exit $rc"
            exit 1
          fi
          # With /config and /cache the bundled database is extracted inside the container.
          root="$RUNNER_TEMP/container"
          mkdir -p "$root/config" "$root/cache"
          printf 'outputTo: UnitTest\nrefreshRidbDataDayInterval: 30\nlastRidbDataRefresh: 2026-01-01T00:00:00.0000000Z\nautoRefresh: false\n' > "$root/config/General.yaml"
          chmod -R a+rwX "$root"
          docker run --rm --volume "$root/config:/config" --volume "$root/cache:/cache" campertron-smoke:local
          size="$(stat -c %s "$root/config/RecreationDotOrg.db")"
          echo "Database extracted in the container: $size bytes"
          if [ "$size" -lt 100000000 ]; then echo "::error::Extracted database is too small"; exit 1; fi
          label="$(docker image inspect campertron-smoke:local --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          if [ "$label" != "$VERSION" ]; then echo "::error::Image version label is '$label', expected '$VERSION'"; exit 1; fi

      # The image must build and run on .NET 10: the runtime image's DOTNET_VERSION, the console's
      # runtimeconfig (framework-dependent, tfm net10.0 on Microsoft.NETCore.App 10.x) and the
      # FrameworkDescription the containerized console reports with --version.
      - name: Container runs on .NET 10
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          env_version="$(docker image inspect campertron-smoke:local --format '{{ range .Config.Env }}{{ println . }}{{ end }}' | sed -n 's/^DOTNET_VERSION=//p')"
          echo "Image DOTNET_VERSION: $env_version"
          case "$env_version" in "$DOTNET_MAJOR_REQUIRED".*) ;; *) echo "::error::Image DOTNET_VERSION is '$env_version', expected $DOTNET_MAJOR_REQUIRED.x"; exit 1 ;; esac
          docker run --rm --entrypoint cat campertron-smoke:local /app/CampertronConsole.runtimeconfig.json > "$RUNNER_TEMP/image.runtimeconfig.json"
          check_framework_dependent_runtimeconfig "$RUNNER_TEMP/image.runtimeconfig.json"
          output="$(docker run --rm campertron-smoke:local --version)"
          echo "$output"
          check_framework_report "$output" "$env_version"

  # Builds the complete release payload on every run (pull request, manual dry run and tag), with
  # read-only permissions: the 16 archives are checked by name, SHA256SUMS.txt is generated and
  # verified, and the release notes are rendered and validated. The output is uploaded as the
  # "release-metadata" artifact, which the tag-only release job publishes unchanged.
  assemble:
    name: Assemble release (checksums, notes)
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-*
          merge-multiple: true
          path: dist
          # Keep each archive exactly as uploaded; without this, .zip archives are extracted on download.
          skip-decompress: true

      # Every expected archive exactly once, as a file, and nothing else. (Artifact names are unique within
      # a run, so a duplicate upload cannot reach this point; an extra, missing, renamed or extracted
      # archive fails here.)
      - name: Check archive names
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          expected="$RUNNER_TEMP/expected.txt"
          expected_archives "$VERSION" > "$expected"
          (cd dist && ls -1) | sort > "$RUNNER_TEMP/actual.txt"
          if ! diff -u "$expected" "$RUNNER_TEMP/actual.txt"; then
            echo "::error::dist/ does not contain exactly the 16 expected archives (see diff above)"
            exit 1
          fi
          dupes="$(sort "$RUNNER_TEMP/actual.txt" | uniq -d)"
          if [ -n "$dupes" ]; then echo "::error::Duplicate archives: $dupes"; exit 1; fi
          echo "All 16 expected archives present exactly once."

      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          mkdir -p release
          (cd dist && sha256sum -- $(ls -1 | sort)) > release/SHA256SUMS.txt
          lines="$(wc -l < release/SHA256SUMS.txt)"
          if [ "$lines" -ne 16 ]; then echo "::error::SHA256SUMS.txt has $lines lines, expected 16"; exit 1; fi
          (cd dist && sha256sum --check --strict ../release/SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Render release notes
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          render_notes "$VERSION" "$PRERELEASE" "$image" "$GITHUB_REPOSITORY" > release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release notes
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          validate_notes release/RELEASE_NOTES.md "$VERSION" "$PRERELEASE" "$image" "$RUNNER_TEMP/expected.txt"
          echo "Release notes validated."

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  # Publishing jobs. Each is gated twice: verify must have decided to publish, AND the triggering event
  # itself must be a push of a v* tag, so pull requests and manual runs can never reach them.
  docker-publish:
    name: Publish image to GHCR
    needs: [verify, binaries, smoke, docker, assemble]
    if: needs.verify.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tags: always the exact version; stable releases also get MAJOR.MINOR and latest. SemVer
      # pre-release versions never move latest (docker_tag_args in .github/release-policy/release-policy.sh).
      - name: Determine image name and tags
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          tags="$(docker_tag_args "$image" "$VERSION" "$PRERELEASE")"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "TAG_ARGS=$tags" >> "$GITHUB_ENV"
          echo "Tags: $tags"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          docker buildx create --name campertron --driver docker-container --use
          # shellcheck disable=SC2086
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file CampertronConsole/Dockerfile \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            $TAG_ARGS --push --metadata-file "$RUNNER_TEMP/metadata.json" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Publishes exactly what the assemble job validated: the 16 archives, its SHA256SUMS.txt and its
  # rendered notes. Nothing is regenerated here; the archives are only re-checked against SHA256SUMS.txt.
  release:
    name: Create GitHub release
    needs: [verify, binaries, smoke, docker, assemble, docker-publish]
    if: needs.verify.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campertron-*
          merge-multiple: true
          path: dist
          # Keep each archive exactly as uploaded; without this, .zip archives are extracted on download.
          skip-decompress: true

      - name: Download validated release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: release

      # The assembled SHA256SUMS.txt must cover exactly the downloaded archives, byte for byte.
      - name: Verify archives against the assembled checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict ../release/SHA256SUMS.txt)
          listed="$(awk '{print $2}' release/SHA256SUMS.txt | sort)"
          present="$(cd dist && ls -1 | sort)"
          if [ "$listed" != "$present" ] || [ "$(echo "$present" | wc -l)" -ne 16 ]; then
            echo "::error::Downloaded archives do not match SHA256SUMS.txt"
            exit 1
          fi
          if ! head -n 1 release/RELEASE_NOTES.md | grep -qxF "# Campertron $VERSION"; then
            echo "::error::RELEASE_NOTES.md was not assembled for version $VERSION"
            exit 1
          fi
          cp release/SHA256SUMS.txt dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Draft first, with every asset attached, then publish as a normal release marked Latest (also for
      # SemVer pre-release versions; GitHub does not allow a prerelease to be Latest). A failure before
      # publishing leaves only a draft.
      - name: Create draft release with assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          tag="v$VERSION"
          read -r -a flags <<< "$(github_release_flags "$PRERELEASE")"
          gh release create "$tag" dist/* --draft --verify-tag --title "Campertron $VERSION" \
            --notes-file release/RELEASE_NOTES.md "${flags[@]}"
          assets="$(gh release view "$tag" --json assets --jq '.assets | length')"
          if [ "$assets" -ne 17 ]; then
            echo "::error::Draft release has $assets assets, expected 17; leaving it as a draft"
            exit 1
          fi
          gh release edit "$tag" --draft=false "${flags[@]}"
          gh release view "$tag" --json url,isPrerelease,isDraft --jq '"Published \(.url) (prerelease: \(.isPrerelease), draft: \(.isDraft))"'

      - name: Check the release is a normal release marked Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          state="$(gh release view "$tag" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "prerelease draft: $state; repository latest: $latest"
          if [ "$state" != "false false" ] || [ "$latest" != "$tag" ]; then
            echo "::error::$tag is published but is not a normal release marked Latest"
            exit 1
          fi
