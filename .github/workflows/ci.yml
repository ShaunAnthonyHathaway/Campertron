name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least privilege: the workflow only needs to read the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Restore, build, test, vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The full history and the tags: the documentation-policy checks below compare the documents with the
      # local tags and the recorded pull-request merges. Nothing in this job derives a version from Git, so the
      # build and the tests are those of a shallow checkout.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every tracked curated release-note fragment (.github/release-notes/v<version>.md) must be valid; each
      # composed release body and its SHA-256 is shown in the job summary for review. Read-only; publishes
      # nothing. A future version needs no fragment here; only a publishing tag requires one (decision D30).
      - name: Check curated release notes
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/campertronconsole"
          rc=0
          check_curated_notes_dir .github/release-notes "$image" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/curated-notes.md" || rc=$?
          cat "$RUNNER_TEMP/curated-notes.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/curated-notes.md"
          exit "$rc"

      # The documentation-policy checks of CLAUDE.md and docs/ai-context (.github/docs-policy/README.md), in this
      # required job and before the build. They read the repository and its local Git metadata only, with the
      # runner's own awk: the checker prefers gawk, which the runner image has, and otherwise uses awk (such as
      # Ubuntu's mawk, which it was also tested with). The first step prints the awk it found.
      - name: Show the documentation-policy environment
        run: |
          set -euo pipefail
          awk_path="$(command -v gawk || command -v awk)"
          echo "awk for check-docs.sh: $awk_path -> $(readlink -f "$awk_path")"
          echo "awk version: $("$awk_path" -W version 2>&1 | sed -n 1p)"
          echo "bash: $(bash --version | sed -n 1p)"
          echo "git: $(git --version)"
          tags="$(git tag -l | wc -l)"
          echo "Local tags: $tags; commits in the history of HEAD: $(git rev-list --count HEAD)"
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error title=Documentation policy::the checkout is shallow; check-docs.sh needs the full history (fetch-depth: 0)"
            exit 2
          fi
          if [ "$tags" -eq 0 ]; then
            echo "::error title=Documentation policy::the checkout has no tags; check-docs.sh compares the release index with them (fetch-depth: 0)"
            exit 2
          fi

      # The checker's own tests (a fixture repository in a temporary directory, then this repository); their
      # exit code decides.
      - name: Test the documentation-policy checker
        run: bash .github/docs-policy/test-check-docs.sh

      # Exit codes (.github/docs-policy/README.md): 0, no finding, and 3, warnings only, pass: a warning is a
      # recommendation, such as a size budget, and stays visible in the log, the job summary and a notice.
      # 1, errors, 2, a usage or environment problem, and any other code fail the job with that code.
      - name: Check the documentation policy
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/check-docs.txt"
          rc=0
          bash .github/docs-policy/check-docs.sh > "$out" 2>&1 || rc=$?
          cat "$out"
          { echo '### Documentation policy'; echo; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "check-docs.sh: no finding (exit 0)." ;;
            3) echo "::notice title=Documentation policy::$(tail -n 1 "$out"): warnings only (exit 3), which do not fail the job" ;;
            1) echo "::error title=Documentation policy::check-docs.sh reported errors (exit 1)"; exit 1 ;;
            2) echo "::error title=Documentation policy::check-docs.sh stopped with a usage or environment problem (exit 2)"; exit 2 ;;
            *) echo "::error title=Documentation policy::check-docs.sh exited with an unexpected code ($rc)"; exit "$rc" ;;
          esac

      # setup-dotnet only installs the SDK; the root global.json decides which installed SDK dotnet uses
      # (a stable .NET 11 SDK, decision D31). The runner image also has other SDKs installed.
      - name: Set up .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      - name: Check SDK policy and selected SDK
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_global_json .
          sdk="$(dotnet --version)"
          check_selected_sdk "$sdk"
          echo "Selected .NET SDK: $sdk"

      - name: Show .NET info
        run: dotnet --info

      # Restore with the Release configuration so the restore graph matches the
      # Release build below.
      - name: Restore
        run: dotnet restore Campertron.sln -p:Configuration=Release

      # No prerelease package, and no EF Core, Microsoft.Data.Sqlite or Microsoft.Extensions package of another
      # .NET major (EF Core 9 and 10 must not return).
      - name: Check package policy
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          mapfile -t assets < <(find . -path '*/obj/project.assets.json' -not -path './.git/*' | sort)
          [ "${#assets[@]}" -ge 5 ] || { echo "::error::expected restored assets for 5 projects, found ${#assets[@]}"; exit 1; }
          check_package_policy "${assets[@]}"
          echo "Package policy passed for ${#assets[@]} projects."

      - name: Build (Release)
        run: dotnet build Campertron.sln --configuration Release --no-restore

      # The tests are integration tests: they extract the embedded SQLite
      # database (about 226 MB) and write through LocalApplicationData, which
      # XDG_DATA_HOME isolates in the runner's temp directory. No test reaches
      # the network: the unit tests' NoLiveNetwork guard fails the run if one
      # does. A missing XDG_DATA_HOME folder is created (D37); the step makes it.
      - name: Test (Release)
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/campertron-data
        timeout-minutes: 15
        run: |
          mkdir -p "$XDG_DATA_HOME"
          dotnet test Campertron.sln --configuration Release --no-build --blame-hang-timeout 10m

      # Scan every PackageReference-based project in the solution. docker-compose.dcproj
      # is not a PackageReference project and is skipped instead of failing the job.
      - name: Vulnerability scan
        run: |
          set -euo pipefail
          mapfile -t projects < <(dotnet sln Campertron.sln list | grep -E '\.csproj$')
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::No .csproj projects found in Campertron.sln"
            exit 1
          fi
          echo "Skipping docker-compose.dcproj (not a PackageReference project; cannot be scanned by dotnet list package)."
          total=0
          for project in "${projects[@]}"; do
            echo "::group::$project"
            dotnet list "$project" package --vulnerable --include-transitive
            json="$(dotnet list "$project" package --vulnerable --include-transitive --format json)"
            count="$(jq '[.projects[]?.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[]] | length' <<<"$json")"
            echo "Vulnerable packages in $project: $count"
            echo "::endgroup::"
            if [ "$count" -gt 0 ]; then
              echo "::error file=$project::$count vulnerable package(s) found"
            fi
            total=$((total + count))
          done
          if [ "$total" -gt 0 ]; then
            echo "::error::$total vulnerable package(s) found across scanned projects"
            exit 1
          fi
          echo "No vulnerable packages found in ${#projects[@]} scanned project(s)."

  # CM2 (decision D40) changed how settings files are replaced and created, which depends on the platform. This job runs
  # the settings-file suites natively on Windows for every pull request and push: the CM1 editor, the CM2 writer (strict
  # UTF-8, the BOM, CRLF, create-only creation, replacement, backup, read-backs, external changes, injected failures),
  # the Windows-only tests (attributes, access rules, read-only files, files held open by other programs, a locked
  # temporary file, reparse points) and, since CM3 (D41), the file classification, the bounded loader, the validation
  # and the Email output's start check, since CM5 (D43) the GUI's settings editing session (saves, conflicts and a
  # created Email.yaml keeping the folder's access rules), and since CM6 (D44) the search-file editing (search files'
  # names, New search, Save As, conflicts), since D66 the SMTP password's sources (absolute paths, links, folders and the
  # password file's contract on Windows), since D67 Ntfy.yaml and ntfy's token sources, and since D69 the GUI's Ntfy.yaml editing session (a new
  # Ntfy.yaml created with the folder's access rules, saves, conflicts). The tests use their own temporary folders. LocalApplicationData can't be redirected
  # on Windows, so the job checks that the runner user's CampertronConfig and CampertronCache never appear. Read-only:
  # it uploads, publishes and pushes nothing (build-and-test.md §AE).
  windows-settings-files:
    name: Windows settings files (CM1 to CM3, CM5, CM6)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-dotnet only installs the SDK; the root global.json decides which installed SDK dotnet uses (decision D31).
      - name: Set up .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      - name: Check SDK policy and selected SDK
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_global_json .
          sdk="$(dotnet --version | tr -d '\r')"
          check_selected_sdk "$sdk"
          echo "Runner: $RUNNER_OS $RUNNER_ARCH, image ${ImageOS:-unknown} ${ImageVersion:-unknown}; selected .NET SDK: $sdk"

      - name: Restore
        run: dotnet restore CampertronUnitTests/CampertronUnitTests.csproj -p:Configuration=Release

      - name: Check package policy
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-policy/release-policy.sh
          check_package_policy CampertronLibrary/obj/project.assets.json CampertronUnitTests/obj/project.assets.json
          echo "Package policy passed for the library and the unit tests."

      - name: Build (Release)
        run: dotnet build CampertronUnitTests/CampertronUnitTests.csproj --configuration Release --no-restore

      # A fresh folder in the runner user's LocalApplicationData, where Campertron keeps its settings, for the tests'
      # ordinary-file checks (CAMPERTRON_TEST_USER_FOLDER); never CampertronConfig or CampertronCache, which must not
      # exist. Prints the access rules a new file gets there, for the record.
      - name: Prepare an isolated user folder and record Windows ACL facts
        run: |
          $ErrorActionPreference = 'Stop'
          $local = [Environment]::GetFolderPath('LocalApplicationData')
          foreach ($name in 'CampertronConfig', 'CampertronCache') {
            if (Test-Path -LiteralPath (Join-Path $local $name)) { Write-Output "::error::$name exists before the tests"; exit 1 }
          }
          $probe = Join-Path $local ('CampertronCiProbe-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probe | Out-Null
          $file = Join-Path $probe 'General.yaml'
          Set-Content -LiteralPath $file -Value 'outputTo: Console' -NoNewline
          foreach ($path in $local, $probe, $file) {
            $acl = Get-Acl -LiteralPath $path
            $explicit = @($acl.Access | Where-Object { -not $_.IsInherited }).Count
            $inherited = @($acl.Access | Where-Object { $_.IsInherited }).Count
            Write-Output "$path : owner $($acl.Owner); protected $($acl.AreAccessRulesProtected); explicit rules $explicit; inherited rules $inherited; attributes $((Get-Item -LiteralPath $path -Force).Attributes)"
            Write-Output "  DACL $($acl.GetSecurityDescriptorSddlForm('Access'))"
          }
          Remove-Item -LiteralPath $file
          "CAMPERTRON_TEST_USER_FOLDER=$probe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test the settings-file suites (Release)
        timeout-minutes: 15
        run: |
          $filter = @(
            'FullyQualifiedName~CampertronUnitTests.function.Base.YamlDocument'
            'FullyQualifiedName~CampertronUnitTests.function.Base.ConfigFileReplace'
            'FullyQualifiedName~CampertronUnitTests.function.Base.GeneralYamlTimestampTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.SettingsBootstrapTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.ConfigFilesTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.SettingsLoaderLimitsTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.ConfigValidationTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.EmailOutputValidationTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.ConfigEditSessionTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.ConfigEditEmailTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.ConfigEditNtfyTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.SearchFileSessionTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.SearchFilesTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.SmtpPasswordTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.NtfyConfigTests'
            'FullyQualifiedName~CampertronUnitTests.function.Base.SecretFileCheckTests'
          ) -join '|'
          dotnet test CampertronUnitTests/CampertronUnitTests.csproj --configuration Release --no-build --blame-hang-timeout 10m `
            --filter $filter --logger 'console;verbosity=normal' --logger 'trx;LogFileName=windows-settings-files.trx' `
            --results-directory "$env:RUNNER_TEMP\test-results"
          exit $LASTEXITCODE

      # Per-class counts and every skipped test with its reason, in the log and the job summary. The Windows-only class
      # must have run (not been skipped as a whole).
      - name: Summarize the Windows test results
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $trx = Get-ChildItem -Path "$env:RUNNER_TEMP\test-results" -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Output '::error::no test results'; exit 1 }
          [xml]$x = Get-Content -LiteralPath $trx.FullName -Raw
          $classes = @{}
          foreach ($u in $x.TestRun.TestDefinitions.UnitTest) { $classes[$u.id] = $u.TestMethod.className.Split('.')[-1] }
          $rows = foreach ($r in $x.TestRun.Results.UnitTestResult) {
            [pscustomobject]@{ Class = $classes[$r.testId]; Name = $r.testName; Outcome = $r.outcome; Reason = "$($r.Output.ErrorInfo.Message)".Trim() }
          }
          $c = $x.TestRun.ResultSummary.Counters
          $lines = @('### Windows settings-file tests', '', "Total $($c.total): passed $($c.passed), failed $($c.failed), not executed $($c.notExecuted)", '',
                     '| Class | Passed | Failed | Skipped |', '|---|---|---|---|')
          foreach ($g in $rows | Group-Object Class | Sort-Object Name) {
            $passed = @($g.Group | Where-Object Outcome -eq 'Passed').Count
            $failed = @($g.Group | Where-Object Outcome -eq 'Failed').Count
            $lines += "| $($g.Name) | $passed | $failed | $($g.Count - $passed - $failed) |"
          }
          foreach ($s in $rows | Where-Object { $_.Outcome -notin 'Passed', 'Failed' }) { $lines += "- skipped $($s.Class).$($s.Name): $($s.Reason)" }
          $lines | Out-Host
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (@($rows | Where-Object { $_.Class -eq 'ConfigFileReplaceWindowsTests' -and $_.Outcome -eq 'Passed' }).Count -eq 0) {
            Write-Output '::error::the Windows-only tests did not run'; exit 1
          }
          if (@($rows | Where-Object { $_.Class -eq 'ConfigEditEmailTests' -and $_.Name -eq 'TheAccessRulesOnWindows_AreNeverBroadened' -and $_.Outcome -eq 'Passed' }).Count -eq 0) {
            Write-Output '::error::the settings editor test of the Windows access rules did not run'; exit 1
          }
          if (@($rows | Where-Object { $_.Class -eq 'SecretFileCheckTests' -and $_.Name -eq 'OnWindows_TheAccessRulesDecide_AndNoPermissionWarning' -and $_.Outcome -eq 'Passed' }).Count -eq 0) {
            Write-Output '::error::the secret file check of the Windows access rules (D75) did not run'; exit 1
          }

      - name: Check that no real data folder was used, and remove the user folder
        if: always()
        run: |
          $local = [Environment]::GetFolderPath('LocalApplicationData')
          $bad = $false
          foreach ($name in 'CampertronConfig', 'CampertronCache') {
            if (Test-Path -LiteralPath (Join-Path $local $name)) { Write-Output "::error::$name was created"; $bad = $true }
          }
          if ($env:CAMPERTRON_TEST_USER_FOLDER -and (Test-Path -LiteralPath $env:CAMPERTRON_TEST_USER_FOLDER)) {
            Write-Output "Entries the tests left in the user folder: $(@(Get-ChildItem -LiteralPath $env:CAMPERTRON_TEST_USER_FOLDER -Force).Count)"
            Remove-Item -LiteralPath $env:CAMPERTRON_TEST_USER_FOLDER -Recurse -Force
          }
          if ($bad) { exit 1 }
          Write-Output "CampertronConfig and CampertronCache were never created in $local."
