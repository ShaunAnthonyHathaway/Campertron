# Documentation policy for check-docs.sh: the registered values and exceptions.
#
# The policy itself is stated in docs/ai-context/README.md (§Maintaining these documents,
# §Size budgets) and docs/ai-context/history/README.md (§Label policy); this file only
# records, in a form the checker reads, the numbers and the exceptions those documents
# name. How to change it: .github/docs-policy/README.md.
#
# One record per line, fields separated by " | ". Lines starting with # are comments.

# --- The mandatory core (docs/ai-context/README.md §Mandatory reading order) -----------
core | CLAUDE.md
core | docs/ai-context/README.md
core | docs/ai-context/current-state.md

# --- Size budgets: recommendations, so an overage is a warning (§Size budgets) -----------
# Sizes are in bytes (1 KB = 1,000 bytes, as the documents count them).
budget-core-total | 36000
budget-file | CLAUDE.md | 16000 | 150
budget-file | docs/ai-context/current-state.md | 8000 | -
budget-file | docs/ai-context/README.md | 12000 | -
budget-current | 60000
budget-business-rules | 100000
budget-history | 250000

# --- Line length: required in the core and in every file created since Phase 1 ---------
line-limit | 1000
