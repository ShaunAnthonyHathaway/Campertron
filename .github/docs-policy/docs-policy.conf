# --- Data safety ------------------------------------------------------------------------
# A path below one of these prefixes is an isolated location, not a user's real data.
safe-path | /home/camper/ | the isolated user of maintainer-procedures.md §Rules for every procedure (unshare and a tmpfs over /home)

# --- Names that look like Markdown paths but are not repository files ---------------------
not-a-path | RELEASE_NOTES.md | the notes file release.yml writes for a draft release; never tracked

# --- Known defects: registered errors in files a change could not correct ---------------
# Each turns that one error into a labeled warning until the file is corrected; the check
# warns when the defect no longer occurs. Fields: check | file | SHA-256 of the line, or -
# for a finding about the whole file | reason.
