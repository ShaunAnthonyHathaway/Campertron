marker | docs/ai-context/current-state.md | Roadmap boundaries | Signing and notarization are not planned | roadmap boundary
marker | docs/ai-context/current-state.md | Roadmap boundaries | Standalone single-file packaging is not planned | roadmap boundary
marker | docs/ai-context/current-state.md | V011-3 Coordinated correction of the autoRun and "startup" terminology | the canonical term for a search with `autoRun: true` is "Enabled (autoRun)", and its negative is "Not enabled" | V011-3's wording, decided by the maintainer on 2026-11-18 and implemented by Phase C (D63)
marker | docs/ai-context/current-state.md | Deferred `v0.1.1` requirements | all three requirements were released in `v0.1.1` | V011-1 to V011-3, implemented by Phases A to C (D60 to D63), were released in v0.1.1 on 2026-11-18 (§BI)

# --- Corrected claims (state.correction): a claim a later record corrected is repeated in CLAUDE.md, a current document
# or the history index only on a line that also says its correction (the regular expression, then the correction's text).
correction | (^|[^0-9#.,/-])307( [a-z]+)? (checks|passed)|307/307|307-check | 302 distinct | PT1's first automated run had 302 distinct checks, not 307: its report counted one run's five checks twice (history/validation/ds_v0.4.0.md §DX)

# --- Data safety ------------------------------------------------------------------------
# A path below one of these prefixes is an isolated location, not a user's real data.
safe-path | /home/camper/ | the isolated user of maintainer-procedures.md §Rules for every procedure (unshare and a tmpfs over /home)

# --- Names that look like Markdown paths but are not repository files ---------------------
not-a-path | RELEASE_NOTES.md | the notes file release.yml writes for a draft release; never tracked

